<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Details Table</title>
    <style>
      .location-table {
        width: 100%;
        border-collapse: collapse;
      }

      .location-table th,
      .location-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      .location-table th {
        background-color: #f2f2f2;
      }
      /* Removing border from Location Name input field */
      .location-table input[type="text"] {
        border: none;
        outline: none; /* To remove focus outline if needed */
        background-color: transparent; /* Optional, if you want the background transparent */
      }
      .add-row-btn {
        margin-top: 10px;
        padding: 10px;
        background-color: var(--control-bg);
        color: white;
        border: none;
        cursor: pointer;
        color: var(--text-color);
        border-radius: 8px;
        font-size: 13px;
        padding: 4px 8px;
        font-size: var(--text-base);
        font-weight: var(--weight-regular);
        letter-spacing: 0.02em;
      }
      .add-row-btn:hover {
        background-color: rgb(231, 231, 231);
      }
      .delete-row-btn {
        margin-top: 10px;
        padding: 10px;
        background-color: #e03636;
        color: white;
        border: none;
        cursor: pointer;

        border-radius: 8px;
        font-size: 13px;
        padding: 4px 8px;
        font-size: var(--text-base);
        font-weight: var(--weight-regular);
        letter-spacing: 0.02em;
      }
      .delete-row-btn:hover {
        background-color: rgb(231, 231, 231);
      }
      .save-btn {
        margin-top: 10px;
        padding: 10px;
        background-color: #171717;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        font-size: 13px;
        padding: 4px 8px;
        font-size: var(--text-base);
        font-weight: var(--weight-regular);
        letter-spacing: 0.02em;
      }
      .save-btn:hover {
        background-color: rgb(231, 231, 231);
        color: #171717;
      }
      .checkbox-container {
        align-items: center;
      }
      .checkbox-container input {
        margin-right: 10px;
      }

      .table-heading {
        color: var(--gray-600);
        background-color: var(--subtle-fg);
        font-size: var(--text-sm);
        font-weight: var(--weight-regular);
        letter-spacing: 0.02em;
      }
      .location-table th:first-child,
      .location-table th:nth-child(2),
      .location-table th:last-child,
      .location-table td:first-child,
      .location-table td:nth-child(2),
      .location-table td:nth-child(5),
      .location-table td:last-child {
        text-align: center;
        vertical-align: middle;
      }
      .hidden {
        display: none;
      }
      .no-bullets {
        list-style-type: none;
        padding-left: 0;
      }
      .delete-file-btn {
        cursor: pointer;
      }
      .attachments {
        align-items: center;
      }
      .file-list-row {
        background: #f2f2f2;
        border-radius: 5px;
        padding: 0 3px;
        margin: 3px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .file-name {
        color: #2b60de;
      }
      .file-name:hover {
        color: #2b60de;
      }
      .file-size {
        font-size: 12px;
      }
      .status-select {
        padding: 5px;
        border-radius: 8px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="table-container">
      <table class="location-table" id="locationTable">
        <thead class="table-heading">
          <tr>
            <th>Check</th>
            <th>Sr. No</th>
            <th>Location Name</th>
            <th>Attachments</th>
            <th>Status</th>
            <th class="hidden">Name</th>
          </tr>
        </thead>
        <tbody id="locationTableBody">
          <!--Dynamically added row here-->
        </tbody>
      </table>
      <!-- <input type="file" id="fileInput" multiple /> -->

      <button class="add-row-btn" id="addRowBtn" onclick="addRow()">
        + Add Location
      </button>
      <button
        class="delete-row-btn hidden"
        id="removeRowBtn"
        onclick="removeRow()"
      >
        - Remove Location
      </button>
      <button
        class="save-btn"
        id="saveOrUpdateLocBtn"
        onclick="saveOrUpdateLocationDetails()"
      >
        Save Location
      </button>
    </div>
    <script>
      if (!window.hasRunFetchTable) {
        window.hasRunFetchTable = true;
        fetchAndPopulateTable();
      }
      if (!window.initialData) {
        let initialData = {}; // Declare only once
      }

      async function fetchAttachments(detail, docname) {
        return new Promise((resolve, reject) => {
          frappe.call({
            method: "frappe.client.get_list",
            args: {
              doctype: "File",
              filters: {
                attached_to_doctype: "Task",
                attached_to_name: docname,
                attached_to_field: detail.name,
              },
              fields: ["*"],
            },
            callback: function (fileResponse) {
              if (fileResponse.message) {
                console.log(fileResponse);
                resolve(fileResponse.message);
              } else {
                reject("Failed to fetch attachments");
              }
            },
          });
        });
      }

      async function fetchAndPopulateTable() {
        const docname = cur_frm.doc.name;

        try {
          const response = await frappe.call({
            method: "sahayog.doc_events.task.get_custom_location_details",
            args: { docname: docname },
          });

          if (response.message) {
            const locationDetails = response.message || [];
            const tableBody = document.getElementById("locationTableBody");

            // Clear existing rows and reset initialData
            tableBody.innerHTML = "";

            initialData = {};

            console.log("initial data", initialData);

            for (const [index, detail] of locationDetails.entries()) {
              const newRow = document.createElement("tr");

              try {
                const files = await fetchAttachments(detail, docname);
                newRow.innerHTML = `
                        <td class="checkbox-container">
                          <input type="checkbox" />
                        </td>
                        <td class="sr-no">${index + 1}</td>
                        <td><input type="text" value="${
                          detail.location_name
                        }" /></td>
                        <td>
                          <div class="attachments">
                            <input type="file" multiple style="display: none;"
                              onclick="handleFileUpload(this, '${detail.name}')"
                              data-name="${detail.name}" />
                            <img src="/assets/sahayog/images/add.png"
                              width="25" height="25" onclick="triggerFileInput('${
                                detail.name
                              }')">
                            <ul class="no-bullets">
                              ${files
                                .map(
                                  (file) => `
                                <li class="file-list-row">
                                  <div>
                                    <a class="file-name" href="${
                                      file.file_url
                                    }" target="_blank">${file.file_name}</a>
                                    <span class="file-size">(${formatFileSize(
                                      file.file_size
                                    )})</span>
                                  </div>
                                  <div>
                                    <img class="delete-file-btn" src="/assets/sahayog/images/close.png" width="10"
                                      onclick="deleteFile('${
                                        file.file_name
                                      }', '${file.attached_to_field}', '${
                                    file.attached_to_name
                                  }','${file.name}')">
                                  </div>
                                </li>
                              `
                                )
                                .join("")}
                            </ul>
                          </div>
                        </td>
                        <td>
                          <select class="status-select">
                            <option value="Pending" ${
                              detail.status === "Pending" ? "selected" : ""
                            }>Pending</option>
                            <option value="Approved" ${
                              detail.status === "Approved" ? "selected" : ""
                            }>Approved</option>
                            <option value="Rejected" ${
                              detail.status === "Rejected" ? "selected" : ""
                            }>Rejected</option>
                          </select>
                        </td>
                        <td class="hidden" data-name="${detail.name}">${
                  detail.name
                }</td>
                      `;

                tableBody.appendChild(newRow);

                // Store the initial data for each detail
                initialData[detail.name] = {
                  location_name: detail.location_name,
                  status: detail.status,
                };
              } catch (error) {
                console.error(error);
              }
            }
          } else {
            frappe.msgprint("No location details found.");
          }
        } catch (error) {
          console.error("Error fetching location details:", error);
        }
      }

      function formatFileSize(sizeInBytes) {
        if (sizeInBytes < 1024) {
          return sizeInBytes + " B"; // Bytes
        } else if (sizeInBytes < 1024 * 1024) {
          return (sizeInBytes / 1024).toFixed(2) + " KB"; // Kilobytes
        } else if (sizeInBytes < 1024 * 1024 * 1024) {
          return (sizeInBytes / (1024 * 1024)).toFixed(2) + " MB"; // Megabytes
        } else {
          return (sizeInBytes / (1024 * 1024 * 1024)).toFixed(2) + " GB"; // Gigabytes
        }
      }

      // Function to update serial numbers
      function updateSerialNumbers() {
        const rows = document.querySelectorAll("#locationTableBody tr");
        rows.forEach((row, index) => {
          row.querySelector(".sr-no").textContent = index + 1;
        });
      }

      // Add event listener after HTML is injected
      function addRow() {
        const tableBody = document.getElementById("locationTableBody");
        const newRow = document.createElement("tr");
        //newRow.classList.add("new-row"); // Mark new rows with a class

        newRow.innerHTML = `
                                   <td class="checkbox-container">
                                       <input type="checkbox" />
                                   </td>
                                   <td class="sr-no"></td>
                                   <td><input type="text" placeholder="Location Name" /></td>
                                    <td><input type="file" multiple  class="hidden" /></td>
                                   <td>
                                       <select class="status-select">
                                           <option value="Pending">Pending</option>
                                           <option value="Approved">Approved</option>
                                           <option value="Rejected">Rejected</option>
                                       </select>
                                   </td>
                                    <td class="hidden" data-name=""></td>
                               `;

        tableBody.appendChild(newRow);
        updateSerialNumbers();
        toggleRemoveButton();
      }

      // Add event listener to checkboxes
      document
        .getElementById("locationTableBody")
        .addEventListener("change", function (event) {
          console.log("Change event detected");
          if (event.target.type === "checkbox") {
            toggleRemoveButton(); // Call function to check if any checkbox is checked
          }
        });

      // Function to handle showing and hiding the remove button
      function toggleRemoveButton() {
        const checkboxes = document.querySelectorAll(
          "#locationTableBody input[type='checkbox']"
        );
        const removeButton = document.getElementById("removeRowBtn");

        // Check if any checkbox is checked
        const isAnyChecked = Array.from(checkboxes).some(
          (checkbox) => checkbox.checked
        );
        console.log("Is any checkbox checked: ", isAnyChecked);
        // Add or remove the 'hidden' class based on the checkbox status
        if (isAnyChecked) {
          removeButton.classList.remove("hidden");
        } else {
          removeButton.classList.add("hidden");
        }
      }

      // Function to remove checked rows
      function removeRow() {
        const tableBody = document.getElementById("locationTableBody");
        const checkboxes = tableBody.querySelectorAll("input[type='checkbox']");
        const rowsToDelete = [];

        checkboxes.forEach((checkbox) => {
          if (checkbox.checked) {
            // Collect the name from the data-name attribute of the row
            const row = checkbox.closest("tr");
            const dataName = row
              .querySelector("td[data-name]")
              .getAttribute("data-name");

            if (dataName) {
              rowsToDelete.push(dataName);
            }
          }
        });

        console.log(rowsToDelete);

        if (rowsToDelete.length > 0) {
          // Call the server to delete the rows from the database
          frappe.call({
            method: "sahayog.doc_events.task.delete_location_details", // Update with your server-side method
            args: {
              names: rowsToDelete,
            },
            callback: function (response) {
              if (response.message.message === "success") {
                console.log(response);
                // Remove the rows from the DOM after successful deletion
                checkboxes.forEach((checkbox) => {
                  if (checkbox.checked) {
                    const row = checkbox.closest("tr");
                    tableBody.removeChild(row);
                  }
                });

                // Update the serial numbers
                updateSerialNumbers();

                // Hide the remove button if no checkboxes are checked
                toggleRemoveButton();
                // Show a Frappe alert after successful deletion
                frappe.show_alert({
                  message: "Selected row have been successfully deleted.",
                  indicator: "green",
                });
                //Optionally refresh the page after the alert
                setTimeout(function () {
                  location.reload();
                }, 1000); // Adjust the delay as needed
              } else {
                frappe.msgprint("Error deleting location details.");
              }
            },
          });
        } else {
          frappe.msgprint("No rows selected for deletion.");
        }
      }

      // Function to handle the update or addition of location details
      function saveOrUpdateLocationDetails() {
        console.log("save hora hai...");
        const rows = document.querySelectorAll("#locationTableBody tr");
        const locationData = [];
        let hasEmptyLocationName = false; // Flag to check for empty location names
        let hasChanges = false; // Flag to check for changes in the table

        rows.forEach((row) => {
          const locationName = row
            .querySelector("input[type='text']")
            .value.trim();
          const status = row.querySelector("select").value;
          const files = row.querySelector("input[type='file']").files;
          const name =
            row.querySelector("td[data-name]").getAttribute("data-name") || ""; // Initially empty

          let fileInfo = [];

          if (files.length > 0) {
            Array.from(files).forEach((file) => {
              fileInfo.push({
                filename: file.name,
                size: file.size,
                type: file.type,
              });
            });
          }

          // Check if locationName is empty
          if (!locationName) {
            hasEmptyLocationName = true;
          }

          // Check if the row is new (not in initialData) or has changes
          if (
            !initialData[name] ||
            initialData[name].location_name !== locationName ||
            initialData[name].status !== status
          ) {
            hasChanges = true;
          }

          locationData.push({
            location_name: locationName,
            status: status,
            name: name,
            file_metadata: fileInfo, // Send only the metadata (filename, size, type)
          });
        });

        // If any locationName is empty, show an alert and stop the save operation
        if (hasEmptyLocationName) {
          frappe.msgprint(
            "Location name cannot be empty. Please fill location name."
          );
          return; // Stop the execution
        }

        // If there are no changes, show an alert and stop the save operation
        if (!hasChanges) {
          frappe.msgprint(
            "No changes detected. Please make changes before saving."
          );
          return; // Stop the execution
        }

        console.log("locations to pass:", locationData);

        const docname = cur_frm.doc.name;
        frappe.call({
          method: "sahayog.doc_events.task.save_or_update_location_details", // Your server method
          args: {
            location_data: locationData,
            docname: docname,
          },
          callback: function (response) {
            if (response.message.message === "success") {
              console.log(response);
              frappe.show_alert({
                message: "Location details saved or updated successfully.",
                indicator: "green",
              });
              location.reload();
              //Optionally refresh the page after the alert
              // setTimeout(function () {
              //   location.reload();
              // }, 1000); // Adjust the delay as needed
            } else {
              frappe.msgprint("Error saving or updating location details.");
            }
          },
        });
      }

      function triggerFileInput(name) {
        const fileInput = document.querySelector(
          `input[type="file"][data-name="${name}"]`
        );
        fileInput.click();
      }

      //Function to attach multiple files
      function handleFileUpload(fileInput, name) {
        event.preventDefault(); // Prevent the default file picker

        // Get the row's docname (this could be stored in a hidden field or data attribute)
        const row = fileInput.closest("tr"); // Get the closest table row (assuming the <input> is inside a <tr>)
        const fieldname = name;
        // Fetch docname from hidden field or a data attribute
        const docname = cur_frm.doc.name;
        console.log("taskname", docname);
        console.log("name", fieldname);
        // Open Frappe's File Upload Dialog
        new frappe.ui.FileUploader({
          allow_multiple: true, // Allow multiple files to be uploaded
          doctype: "Task", // The doctype (e.g., "Task")
          docname: docname, // The dynamic docname from the row
          fieldname: fieldname, // The dynamic fieldname from the row
          on_success: function (file) {
            console.log("File uploaded:", file);
            frappe.show_alert({
              message: "File uploaded successfully.",
              indicator: "green",
            });
            //Optionally refresh the page after the alert
            setTimeout(function () {
              location.reload();
            }, 1000); // Adjust the delay as needed
            // Perform additional actions, like attaching the file to a specific Doctype
          },
        });
      }

      function deleteFile(fileName, childDocname, docname, fileDocName) {
        let file_name = fileName;
        let attached_to_field = childDocname;
        let attached_to_name = docname;

        console.log(file_name, childDocname, docname);
        frappe.call({
          method: "sahayog.doc_events.task.delete_file",
          args: {
            name: fileDocName,
          },
          callback: function (response) {
            if (response.message.message === "success") {
              console.log(response);
              //frappe.msgprint(`File ${fileName} deleted successfully.`);
              frappe.show_alert({
                message: "File has been successfully deleted.",
                indicator: "green",
              });
              //Optionally refresh the page after the alert
              setTimeout(function () {
                location.reload();
              }, 500); // Adjust the delay as needed
            } else {
              frappe.msgprint(`Failed to delete file ${fileName}.`);
            }
          },
          error: function (error) {
            console.error("Error deleting file:", error);
            frappe.msgprint("An error occurred while deleting the file.");
          },
        });
      }
    </script>
  </body>
</html>
