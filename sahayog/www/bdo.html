<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee KPI Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #fff;
        color: #1f2937;
        padding: 0px;
      }
      .dashboard {
        max-width: 1100px;
        margin: auto;
        background: white;
        border-radius: 0px;
        padding: 5px;
        height: 100vh;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }
      .header p {
        margin: 6px 0;
        color: #6b7280;
        font-size: 16px;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin-bottom: 30px;
        font-size: 15px;
        color: #374151;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 20px;
      }
      .card {
        border-radius: 16px;
        padding: 8px 14px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
        text-align: left;
        min-height: 50px;
        border: 1px solid #cdcdcd;
      }
      .card h2 {
        font-size: 20px;
        margin: 10px 0;
        font-weight: 700;
      }
      .card p {
        margin: 0;
        font-size: 12px;
        font-weight: 500;
      }
      @media (max-width: 600px) {
        .card h2 {
          font-size: 22px;
        }
      }
      .percent {
        font-size: 28px;
        font-weight: 700;
        color: #000;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div class="header">
        <p style="text-align: right; color: #6b7280; font-size: 16px">
          Last Update: <span id="date"></span>
        </p>
        <h1 id="employee_name">Data Is Not available</h1>
        <p id="branch_designation"></p>
      </div>
      <div class="info-grid" id="info-grid"></div>
      <div class="grid">
        <div class="card blue">
          <p>Active FD Accounts vs Collection</p>
          <h2><span id="fd_ac">0</span>/ ₹<span id="fd_atm">0</span></h2>
        </div>
        <div class="card blue">
          <p>Active 6M FD Accounts vs Collection</p>
          <h2><span id="fd_6m_ac">0</span>/ ₹<span id="fd_6m_amt">0</span></h2>
        </div>
        <div class="card green">
          <p>DAM Account Count & Collection</p>
          <h2><span id="dam_ac">0</span> / ₹<span id="dam_amt">0</span></h2>
        </div>
        <div class="card">
          <div class="card-title">RD Demand vs Collection</div>
          <h2>
            <span id="rd_demand">0</span> / ₹<span id="rd_collection">0</span>
          </h2>
        </div>
        <div class="card orange">
          <p>New SMBG</p>
          <h2 id="new_smbg_ac">0</h2>
          <p>₹<span id="new_smbg_amt">0</span></p>
        </div>
        <div class="card pink">
          <p>New RD Opened</p>
          <h2 id="new_rd_ac">0</h2>
          <p>₹<span id="new_rd_amt">0</span></p>
        </div>
        <div class="card red">
          <p>MIS Collection</p>
          <h2>₹<span id="mis_amt">0</span></h2>
        </div>
        <div class="card gray">
          <p>Achieved DAM Collection</p>
          <h2 id="achieved_percent">0%</h2>
        </div>
      </div>
    </div>
    <script>
      async function loadKPI() {
        try {
          const res = await fetch(
            "/api/method/sahayog.mis.doctype.bdo_performance.bdo_performance.get_user_mis_data"
          );
          const data = await res.json();

          console.log("API Response:", data);

          if (data.message && data.message.success) {
            const kpiData = data.message.data;
            console.log("KPI Data:", kpiData);

            // Update last updated date
            if (data.message.last_updated) {
              const updateDate = new Date(data.message.last_updated);
              const day = updateDate.getDate();
              const month = updateDate.getMonth() + 1;
              const year = updateDate.getFullYear();
              const formatted = `${day}/${month}/${year}`;
              document.getElementById("date").textContent = formatted;
            }

            // Update header information
            document.getElementById("employee_name").textContent =
              kpiData.Name || kpiData.name || "N/A";
            document.getElementById("branch_designation").textContent = `${
              kpiData["Branch Name"] || kpiData.branch_name || "N/A"
            } – ${
              kpiData["Designation Name"] || kpiData.designation_name || "N/A"
            }`;

            // Update info grid
            const infoHtml = `
              <div><strong>Zone:</strong> ${
                kpiData["Zone Name"] || kpiData.zone_name || "N/A"
              }</div>
              <div><strong>Region:</strong> ${
                kpiData["Region Name"] || kpiData.region_name || "N/A"
              }</div>
              <div><strong>District:</strong> ${
                kpiData["District Name"] || kpiData.district_name || "N/A"
              }</div>
              <div><strong>Emp ID:</strong> ${
                kpiData.EmpID || kpiData.emp_id || "N/A"
              }</div>
              <div><strong>Join Duration:</strong> ${
                kpiData["Join dur"] || kpiData.join_duration || "N/A"
              }</div>
              <div><strong>SSA Agents:</strong> ${
                kpiData["Total ss/Agnt"] || kpiData.total_agents || 0
              } (New: ${
              kpiData["New Ss/Agnt"] || kpiData.new_agents || 0
            })</div>
              <div><strong>Active:</strong> ${
                kpiData.Active || kpiData.active || 0
              }</div>
              <div><strong>Inactive:</strong> ${
                kpiData.Inactive || kpiData.inactive || 0
              }</div>
            `;
            document.getElementById("info-grid").innerHTML = infoHtml;

            // Update KPI cards with MIS data
            // FD Accounts and Amount
            document.getElementById("fd_ac").textContent =
              kpiData["FD AC"] || kpiData.fd_accounts || 0;
            document.getElementById("fd_atm").textContent = formatMoney(
              kpiData["FD AMT"] || kpiData.fd_amount || 0
            );

            // 6M FD Accounts and Amount
            document.getElementById("fd_6m_ac").textContent =
              kpiData["FD 6M AC"] || kpiData.fd_6m_accounts || 0;
            document.getElementById("fd_6m_amt").textContent = formatMoney(
              kpiData["FD 6M AMT"] || kpiData.fd_6m_amount || 0
            );

            // DAM Accounts and Amount
            document.getElementById("dam_ac").textContent =
              kpiData["DAM AC"] || kpiData.dam_accounts || 0;
            document.getElementById("dam_amt").textContent = formatMoney(
              kpiData["DAM AMT"] || kpiData.dam_amount || 0
            );

            // RD Demand and Collection
            document.getElementById("rd_demand").textContent = formatMoney(
              kpiData["TOTAL RD/SMBG DEMAND"] ||
                kpiData.total_rd_smbg_demand ||
                0
            );
            document.getElementById("rd_collection").textContent = formatMoney(
              kpiData["TOTAL RD/SMBG COLLECTION"] ||
                kpiData.total_rd_smbg_collection ||
                0
            );

            // New SMBG
            document.getElementById("new_smbg_ac").textContent =
              kpiData["NEW SMBG AC"] || kpiData.new_smbg_accounts || 0;
            document.getElementById("new_smbg_amt").textContent = formatMoney(
              kpiData["NEW SMBG AMT"] || kpiData.new_smbg_amount || 0
            );

            // New RD
            document.getElementById("new_rd_ac").textContent =
              kpiData["NEW RD AC"] || kpiData.new_rd_accounts || 0;
            document.getElementById("new_rd_amt").textContent = formatMoney(
              kpiData["NEW RD AMT"] || kpiData.new_rd_amount || 0
            );

            // MIS Amount
            document.getElementById("mis_amt").textContent = formatMoney(
              kpiData["MIS AMT"] || kpiData.mis_amount || 0
            );

            // Calculate achievement percentage if needed
            const damAmount = parseFloat(kpiData["DAM AMT"] || 0);
            const achievedPercent =
              damAmount > 0 ? Math.round((damAmount / 100000) * 100) : 0; // Adjust calculation as needed
            document.getElementById(
              "achieved_percent"
            ).textContent = `${achievedPercent}%`;
          } else {
            console.error(
              "Error in response:",
              data.message?.message || "Unknown error"
            );
            document.getElementById("employee_name").textContent =
              "Error loading data";
          }
        } catch (err) {
          console.error("Error fetching KPI data:", err);
          document.getElementById("employee_name").textContent =
            "Error loading data";
        }
      }

      function formatMoney(value) {
        const numValue = parseFloat(value) || 0;
        return numValue.toLocaleString("en-IN", {
          maximumFractionDigits: 0,
        });
      }

      loadKPI();
    </script>
  </body>
</html>
