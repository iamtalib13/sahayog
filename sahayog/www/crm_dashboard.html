<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Dashboard</title>
    <!-- Include Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      /* You can add any custom CSS styles here */

      body {
        font-family: Arial, sans-serif;
        background-color: #f2fbff;
      }
      h3 {
        text-align: center;
      }

      .crm-portal-button {
        display: inline-flex;
        align-items: center;
        padding: 10px 16px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease-in-out;
      }

      .crm-portal-button:hover {
        text-decoration: underline;
      }

      .redirect-icon {
        margin-left: 8px;
      }

      .dashboard-cards {
        display: flex;
        gap: 10px;
        margin: 10px;
      }

      .lead-card {
        font-size: large;
        color: #f0f0f0;
        padding: 20px;
        border-radius: 5px;
        width: 240px;
        text-align: center;
        box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
      }

      #total-leads-card {
        background: #7181ad; /* Dark Navy Blue */
        color: #ffffff;
      }

      #assigned-leads-card {
        background: #6488a9; /* Dark Slate */
        color: #ffffff;
      }

      #escalated-leads-card {
        background: #976562; /* Dark Maroon */
        color: #ffffff;
      }

      #conversion-rate-card {
        background: #606f72; /* Charcoal Gray */
        color: #ffffff;
      }

      a {
        text-decoration: none;
        color: #f0f0f0;
      }
      .lead-visual-card {
        background: white;
        padding: 10px 20px;
        border-radius: 5px;
        width: 100%;

        box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
      }
      .task-container {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        width: 320px;
        padding: 16px;
      }
      .task-container h3 {
        margin-top: 0;
        font-size: 18px;
        margin-bottom: 16px;
        color: #333;
      }
      .task-day {
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
      }
      .task-day strong {
        display: block;
        font-size: 16px;
        margin-bottom: 4px;
      }
      .task-day small {
        color: gray;
      }
      .task {
        background: #f0f0f0;
        border-radius: 8px;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        cursor: pointer;
      }
      .time {
        font-size: 12px;
        color: #333;
        white-space: nowrap;
      }
      .bar {
        width: 4px;
        height: 30px;
        background: #7196a1;
        border-radius: 2px;
      }
      .description {
        font-size: 14px;
        color: #333;
      }
      .task .time small {
        color: green;
      }

      .task .time small:contains("Overdue") {
        color: red;
      }
      .header-content {
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div id="lead-dashboard">
      <header class="dashboard-header">
        <div
          class="header-content"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div style="display: flex; align-items: center">
            <img
              src="assets/sahayog/images/tree.png"
              width="50"
              height="50"
              alt="Sahayog Logo"
              class="logo"
              style="margin-right: 10px"
            />
            <h1 class="dashboard-title">Sahayog CRM Dashboard</h1>
          </div>

          <div>
            <a
              id="crm-portal-link"
              href="/crm/leads/view/list?view=5"
              class="crm-portal-button"
              target="_blank"
              style="text-decoration: none; color: #007bff; font-weight: bold"
            >
              CRM Portal
              <span class="redirect-icon">🔗</span>
            </a>
          </div>
        </div>
      </header>

      <div class="dashboard-cards">
        <div class="lead-card" id="total-leads-card">
          <h3>
            <a
              id="total-leads-link"
              href="/crm/leads/view/list?view=5"
              target="_blank"
              >Total Leads</a
            >
          </h3>
          <p id="total-leads">0</p>
        </div>

        <div class="lead-card" id="assigned-leads-card">
          <h3>
            <a
              id="assigned-leads-link"
              href="/crm/leads/view/list?view=7"
              target="_blank"
              >Assigned to Me</a
            >
          </h3>
          <p id="assigned-leads">0</p>
        </div>

        <div class="lead-card" id="escalated-leads-card">
          <h3>
            <a
              id="escalated-leads-link"
              href="/crm/leads/view/list?view=12"
              target="_blank"
              >Escalated to Me</a
            >
          </h3>
          <p id="escalated-leads">0</p>
        </div>

        <!-- Conversion Rate with Column Chart -->
        <div class="lead-card" id="conversion-rate-card">
          <h3>Conversion Rate</h3>
          <p id="conversion-rate">0</p>
        </div>
      </div>
      <div class="dashboard-cards">
        <div class="lead-visual-card" id="lead-tasks-card">
          <h3>Upcoming Tasks</h3>
          <!-- Sync message -->
          <!-- Date and Syncing Message -->

          <div id="task-container">
            <!-- Task items will be populated here dynamically by JavaScript -->
          </div>
          <!-- Tasks will be populated here dynamically by JavaScript -->
        </div>

        <div class="lead-visual-card" id="lead-status-card">
          <h3>Lead by Status</h3>
          <div
            style="display: flex; justify-content: center; align-items: center"
          >
            <canvas id="statusPieChart" width="300" height="300"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- CRM Page content
    <div class="card">
      <h3>Status-wise Leads</h3>
      <canvas id="statusPieChart" width="400" height="400"></canvas>
    </div> -->

    <!-- JavaScript Code -->

    <script>
      fetchCRMViewSettingsname();

      async function fetchCRMViewSettingsname() {
        try {
          const response = await fetch(
            "api/method/sahayog.scrm.api.sahayog_crm_dashboard.get_all_crm_view_settings",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            }
          );

          if (response.ok) {
            const res = await response.json();
            const settings = res.message; // your array

            // For each item, check label and update corresponding link
            settings.forEach((item) => {
              if (!item.label) return; // skip if no label property

              switch (item.label) {
                case "My Leads":
                  updateLinkHref("total-leads-link", item.name);
                  updateLinkHref("crm-portal-link", item.name);
                  break;
                case "Assigned To Me":
                  updateLinkHref("assigned-leads-link", item.name);
                  break;
                case "Escalated To Me":
                  updateLinkHref("escalated-leads-link", item.name);
                  break;
                // add more cases if needed
                default:
                  // do nothing or handle unknown label
                  break;
              }
            });
          } else {
            console.error(
              "Failed to fetch CRM view settings. Status:",
              response.status
            );
          }
        } catch (error) {
          console.error("Error fetching CRM view settings:", error);
        }
      }

      function updateLinkHref(id, viewName) {
        const link = document.getElementById(id);
        if (link) {
          link.href = `/crm/leads/view/list?view=${viewName}`;
        }
      }

      // Initialize the container first
      const leadTasksContainer = document.getElementById("task-container");

      // Now call the function to fetch tasks
      fetchTodayTasks();
      // Poll every 1 minute (60,000 ms)
      setInterval(fetchTodayTasks, 60000);

      async function fetchTodayTasks() {
        try {
          // Generate the header with syncing message
          const headerHTML = generateTodayHeader();

          // Render the header before the request
          leadTasksContainer.innerHTML = headerHTML;

          // Find the syncing message element
          const syncingMessage = document.getElementById("syncing-message");

          // Display the syncing message
          if (syncingMessage) {
            syncingMessage.style.display = "inline";
          }

          // Fetch tasks from the API
          const response = await fetch(
            "/api/method/sahayog.scrm.api.sahayog_crm_dashboard.get_today_tasks"
          );
          const tasks = await response.json();
          const data = tasks.message;

          console.log("Tasks: ", data);

          // Render tasks or show "No tasks for today"
          if (data.length > 0) {
            renderTasks(data);
          } else {
            leadTasksContainer.innerHTML = `
        ${headerHTML}
        <p>No tasks for today.</p>
      `;
          }
        } catch (error) {
          console.error("Error fetching tasks:", error);
        } finally {
          // Hide the "Syncing..." message after 3 seconds
          const syncingMessage = document.getElementById("syncing-message");
          if (syncingMessage) {
            setTimeout(() => {
              syncingMessage.style.display = "none";
            }, 3000); // <-- 3 seconds delay
          }
        }
      }

      // Format time to display AM/PM
      function formatTime(dateStr) {
        const date = new Date(dateStr);
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const ampm = hours >= 12 ? "PM" : "AM";
        const formattedTime = `${hours % 12 || 12}:${minutes
          .toString()
          .padStart(2, "0")} ${ampm}`;
        return formattedTime;
      }

      // Calculate the time difference
      function getTimeDifference(dueDate) {
        const now = new Date();
        const due = new Date(dueDate);
        const diffMs = due - now;

        if (diffMs <= 0) return "Overdue";

        const hours = Math.floor(diffMs / (1000 * 60 * 60));
        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

        return hours > 0 ? `In ${hours}h ${minutes}min` : `In ${minutes}min`;
      }

      // Generate header with date and syncing message
      function generateTodayHeader() {
        return `
    <div class="task-day">
      <strong>
        ${new Date().toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
        })} 
        <small>Today</small>
      </strong>
      <!-- Syncing Message -->
      <span id="syncing-message" style="margin-left: 10px; font-size:12px; align-items: center; ">
          <!-- <img src="assets/sahayog/images/cloud-sync.png" width=20 height=20 alt="Syncing..." />-->
           Syncing...</span>
    </div>
  `;
      }

      // Render tasks
      function renderTasks(tasks) {
        const headerHTML = generateTodayHeader();
        const tasksHTML = tasks
          .map((task) => {
            return `
        <div class="task" onclick="redirectToTask('${task.reference_docname}')">
          <div class="time">
            ${formatTime(task.due_date)}<br />
            <small>${getTimeDifference(task.due_date)}</small>
          </div>
          <div class="bar"></div>
          <div class="description">${task.title}</div>
        </div>
      `;
          })
          .join("");

        leadTasksContainer.innerHTML = headerHTML + tasksHTML;
      }

      // Redirect to the specific task in a new tab
      window.redirectToTask = function (referenceDocname) {
        const baseUrl = "/crm/leads";
        const fullUrl = `${baseUrl}/${referenceDocname}?view=5&viewType=list#tasks`;
        window.open(fullUrl, "_blank");
      };

      // Function to render the status pie chart
      function renderStatusPieChart(statusData) {
        const ctx = document.getElementById("statusPieChart").getContext("2d");
        const labels = statusData.map((s) => s.status);
        const values = statusData.map((s) => s.count);

        new Chart(ctx, {
          type: "pie",
          data: {
            labels: labels,
            datasets: [
              {
                data: values,
                backgroundColor: [
                  "#36a2eb",
                  "#ffcd56",
                  "#4bc0c0",
                  "#ff6384",
                  "#9966ff",
                ],
              },
            ],
          },
          options: {
            responsive: false,
            plugins: {
              legend: { position: "bottom" },
              tooltip: {
                callbacks: {
                  label: function (tooltipItem) {
                    return `${tooltipItem.label}: ${tooltipItem.raw} leads`;
                  },
                },
              },
            },
          },
        });
      }

      // Replace frappe.call with fetch() to call API and get data
      async function fetchLeadDashboardData() {
        try {
          const response = await fetch(
            "api/method/sahayog.scrm.api.sahayog_crm_dashboard.get_lead_dashboard_data",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            }
          );

          if (response.ok) {
            const res = await response.json();
            const data = res.message; // Access the 'message' field
            console.log("Lead Dashboard Data: ", data);

            // Set numbers
            document.getElementById("total-leads").innerText = data.total_leads;
            document.getElementById("assigned-leads").innerText =
              data.assigned_leads;
            document.getElementById("escalated-leads").innerText =
              data.escalated_leads[0].count;
            document.getElementById("conversion-rate").innerText =
              data.conversion_rate + "%";

            // document.getElementById("escalated-leads").innerText =
            //   data.escalated_leads;

            // Draw updated Pie Chart
            renderStatusPieChart(data.status_wise);
          } else {
            console.error("Failed to fetch data: ", response.status);
          }
        } catch (error) {
          console.error("Error fetching data: ", error);
        }
      }

      // Call the fetch function when the page is ready
      fetchLeadDashboardData();
    </script>
  </body>
</html>
