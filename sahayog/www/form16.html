<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM 16 Downloader</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
        text-align: center;
      }

      h2 {
        margin-bottom: 10px;
        color: #333;
      }

      p {
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .input-group {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        text-transform: uppercase;
      }

      input:focus {
        outline: none;
        border-color: #0078d4;
      }

      button {
        background: #0078d4;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
      }

      button:hover {
        background: #005ea6;
      }

      .message {
        margin-top: 15px;
        font-size: 14px;
        color: #d9534f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>FORM 16 Downloader</h2>
      <p>Enter your PAN Number to open the Form 16 PDF.</p>

      <div class="input-group">
        <input
          type="text"
          id="pan"
          maxlength="10"
          placeholder="Enter PAN Number"
        />
        <button onclick="downloadAllFiles()">Download</button>
      </div>

      <div class="message" id="message" style="color: #666;">Format: ABCDE 1234 F</div>
      
      <div style="margin-top: 20px;">
        <a href="https://sahayogmultistate-my.sharepoint.com/personal/rehan_khan_sahayogmultistate_com/_layouts/15/onedrive.aspx?id=%2Fpersonal%2Frehan%5Fkhan%5Fsahayogmultistate%5Fcom%2FDocuments%2FFORM%2016%2FNew%20folder%20%282%29&ct=1781006783375&or=Teams%2DHL&ga=1&LOF=1" 
           target="_blank" 
           style="color: #0078d4; text-decoration: none; font-size: 13px; font-weight: bold;">
          View All Files in Folder
        </a>
      </div>
    </div>

    <script>
      function downloadAllFiles() {
        const panInput = document.getElementById("pan");
        const pan = panInput.value.trim().toUpperCase();
        const message = document.getElementById("message");
        message.innerHTML = "";
        
        const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;
        if (!panRegex.test(pan)) {
          message.style.color = "#d9534f";
          message.innerHTML = "Invalid Format! Standard PAN: ABCDE1234F";
          panInput.style.borderColor = "#d9534f";
          return;
        }

        panInput.style.borderColor = "#28a745";
        const quarters = ["Q1", "Q2", "Q3", "Q4"];
        const year = "2025-26";

        message.style.color = "#0078d4";
        message.innerHTML = "Processing downloads... Please allow pop-ups.";

        quarters.forEach((q, index) => {
          setTimeout(() => {
            const fileName = `${pan}_${q}_${year}.pdf`;
            const sourceUrl = `/personal/rehan_khan_sahayogmultistate_com/Documents/FORM 16/New folder (2)/${fileName}`;
            
            // Using the reliable download.aspx pattern as confirmed by user
            const url = `https://sahayogmultistate-my.sharepoint.com/personal/rehan_khan_sahayogmultistate_com/_layouts/15/download.aspx?SourceUrl=${encodeURIComponent(sourceUrl)}`;

            window.open(url, "_blank");

            if (index === quarters.length - 1) {
              message.style.color = "#28a745";
              message.innerHTML = "Download requests sent.";
            }
          }, index * 1000);
        });
      }

      // Character-by-Character Strict Validation
      document.getElementById("pan").addEventListener("input", function (e) {
        let originalValue = e.target.value.toUpperCase();
        let cleanValue = "";
        
        for (let i = 0; i < originalValue.length && i < 10; i++) {
          let char = originalValue[i];
          if (i < 5) {
            if (/[A-Z]/.test(char)) cleanValue += char;
          } else if (i < 9) {
            if (/[0-9]/.test(char)) cleanValue += char;
          } else {
            if (/[A-Z]/.test(char)) cleanValue += char;
          }
        }
        
        e.target.value = cleanValue;
        
        const message = document.getElementById("message");
        if (cleanValue.length === 10) {
          e.target.style.borderColor = "#28a745";
          message.innerHTML = "";
        } else {
          e.target.style.borderColor = "#ccc";
          message.style.color = "#666";
          message.innerHTML = "Format: ABCDE 1234 F";
        }
      });

      document.getElementById("pan").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          downloadAllFiles();
        }
      });
    </script>
  </body>
</html>
