<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM 16 Downloader</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
        text-align: center;
      }

      h2 {
        margin-bottom: 10px;
        color: #333;
      }

      p {
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        text-transform: uppercase;
        text-align: center;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      button {
        background: #0078d4;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s;
      }

      button:hover {
        background: #005ea6;
      }

      .btn-all {
        grid-column: span 2;
        background: #28a745;
      }

      .btn-all:hover {
        background: #218838;
      }

      .message {
        margin-top: 15px;
        font-size: 14px;
        color: #d9534f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>FORM 16 Downloader</h2>
      <p>Enter your PAN Number to download Quarters (2025-26).</p>

      <div class="input-group">
        <input
          type="text"
          id="pan"
          maxlength="10"
          placeholder="ENTER PAN NUMBER"
        />
        
        <div class="button-grid">
          <button onclick="handleDownload('Q1')">Q1</button>
          <button onclick="handleDownload('Q2')">Q2</button>
          <button onclick="handleDownload('Q3')">Q3</button>
          <button onclick="handleDownload('Q4')">Q4</button>
          <button class="btn-all" onclick="downloadAll()">Download All (Q1 - Q4)</button>
        </div>
      </div>

      <div class="message" id="message"></div>
    </div>

    <script>
      function getDownloadUrl(pan, quarter) {
        const fileName = `${pan}_${quarter}_2025-26.pdf`;
        const sourceUrl = `/personal/rehan_khan_sahayogmultistate_com/Documents/FORM/${fileName}`;
        return `https://sahayogmultistate-my.sharepoint.com/personal/rehan_khan_sahayogmultistate_com/_layouts/15/download.aspx?SourceUrl=${encodeURIComponent(sourceUrl)}`;
      }

      function triggerDownload(url) {
        // Using a NAMED window ('form16_downloader') ensures all files
        // download through the SAME single new tab instead of opening many.
        window.open(url, 'form16_downloader');
      }

      function handleDownload(quarter) {
        const pan = document.getElementById("pan").value.trim().toUpperCase();
        const message = document.getElementById("message");
        message.innerHTML = "";

        const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;

        if (!panRegex.test(pan)) {
          message.innerHTML = "Please enter a valid PAN number.";
          message.style.color = "#d9534f";
          return;
        }

        const url = getDownloadUrl(pan, quarter);
        triggerDownload(url);
      }

      function downloadAll() {
        const pan = document.getElementById("pan").value.trim().toUpperCase();
        const message = document.getElementById("message");
        message.innerHTML = "";

        const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;

        if (!panRegex.test(pan)) {
          message.innerHTML = "Please enter a valid PAN number.";
          message.style.color = "#d9534f";
          return;
        }

        const quarters = ['Q1', 'Q2', 'Q3', 'Q4'];
        message.innerHTML = "Downloading all quarters in one tab... Please wait.";
        message.style.color = "#0078d4";

        quarters.forEach((q, index) => {
          setTimeout(() => {
            const url = getDownloadUrl(pan, q);
            triggerDownload(url);

            if (index === quarters.length - 1) {
              setTimeout(() => {
                message.innerHTML = "All 4 quarters requested. You may close the extra tab if it stays open.";
                message.style.color = "#28a745";
              }, 1500);
            }
          }, index * 1500); // 1.5s delay to ensure each download is registered
        });
      }

      document.getElementById("pan").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          handleDownload('Q2'); 
        }
      });
    </script>
  </body>
</html>
