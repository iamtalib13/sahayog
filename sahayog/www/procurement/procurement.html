<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sahayog Procurement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <style>
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #4b5563;
      border-radius: 3px;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
    }
    th {
      position: sticky;
      top: 0;
      background-color: #f3f4f6;
    }
  </style>
  <link rel="icon" href="/assets/sahayog/images/tree.png" type="image/png" />
</head>
<body class="bg-white min-h-screen flex flex-col">
  <div class="flex flex-1 min-h-0">
    <!-- Sidebar -->
    <aside class="bg-gray-700 text-gray-300 w-48 flex flex-col justify-between">
      <div>
        <div class="px-4 py-4 text-sm font-normal border-b border-gray-600 flex items-center space-x-2">
          <img src="/assets/sahayog/images/tree.png" alt="Sahayog Logo" class="h-5 w-auto" />
          <span>Sahayog Procurement</span>
        </div>
        
        <nav class="mt-4 space-y-3 px-3 text-sm select-none">
          <!-- Master -->
          <div>
            <button
              id="master-toggle"
              type="button"
              class="w-full flex items-center justify-between text-gray-300 hover:text-white font-normal"
              aria-expanded="true"
              onclick="toggleMenu('master-submenu')"
            >
              <span class="flex items-center">
                <i class="fas fa-file-alt mr-2"></i>
                Master
              </span>
              <i class="fas fa-chevron-down text-xs"></i>
            </button>
            <div id="master-submenu" class="mt-1 ml-6 space-y-1">
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Item')">
                <i class="far fa-square mr-2 text-xs"></i> Item
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Vendor')">
                <i class="far fa-square mr-2 text-xs"></i> Vendor
              </button>
            </div>
          </div>

          <!-- Transactions -->
          <div>
            <button
              id="transactions-toggle"
              type="button"
              class="w-full flex items-center justify-between text-gray-300 hover:text-white font-normal"
              aria-expanded="false"
              onclick="toggleMenu('transactions-submenu')"
            >
              <span class="flex items-center">
                <i class="fas fa-exchange-alt mr-2"></i>
                Transactions
              </span>
              <i class="fas fa-chevron-down text-xs"></i>
            </button>
            <div id="transactions-submenu" class="mt-1 ml-6 space-y-1 hidden">
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Material Request')">
                <i class="far fa-square mr-2 text-xs"></i> Material Request
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Request for Quotation')">
                <i class="far fa-square mr-2 text-xs"></i> Request for Quotation
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Supplier Quotation')">
                <i class="far fa-square mr-2 text-xs"></i> Supplier Quotation
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Purchase Order')">
                <i class="far fa-square mr-2 text-xs"></i> Purchase Order
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Purchase Receipt')">
                <i class="far fa-square mr-2 text-xs"></i> Purchase Receipt
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Purchase Invoice')">
                <i class="far fa-square mr-2 text-xs"></i> Purchase Invoice
              </button>
              <button class="w-full text-left text-gray-300 hover:text-white flex items-center text-sm" onclick="selectOption('Payment Entry')">
                <i class="far fa-square mr-2 text-xs"></i> Payment Entry
              </button>
            </div>
          </div>

          <!-- Reports -->
          <button
            id="reports-btn"
            class="w-full flex items-center text-gray-300 hover:text-white font-normal text-sm"
            onclick="selectOption('Reports')"
          >
            <i class="fas fa-chart-bar mr-2"></i>
            Reports
          </button>
        </nav>
      </div>
      <div class="flex justify-around bg-gray-800 py-2">
        <button class="text-gray-400 hover:text-white text-lg">
          <i class="fas fa-exclamation-triangle"></i>
        </button>
        <button class="text-gray-400 hover:text-white text-lg">
          <i class="fas fa-home"></i>
        </button>
        <button class="text-gray-400 hover:text-white text-lg">
          <i class="fas fa-power-off"></i>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-h-0">
      <!-- Header -->
      <header class="flex items-center bg-yellow-400 text-gray-900 px-4 h-12 text-base font-semibold select-none">
        <button class="mr-3 text-lg">
          <i class="fas fa-bars"></i>
        </button>
        <i class="fas fa-home mr-2"></i>
        <span class="font-extrabold text-lg" id="main-title">Sahayog Procurement</span>
        <div class="flex-1"></div>
        <div class="flex space-x-6 pr-2 text-sm">
          <span>Financial Year - 2025-2026</span>
          <span>Welcome, Admin</span>
        </div>
      </header>

      <!-- Content area -->
      <main class="flex-1 p-4 overflow-auto">
        <div id="content-area" class="border border-gray-200 bg-gray-50 h-full max-w-full rounded-sm p-4 overflow-auto">
          <div id="filters" class="mb-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 hidden">
            <!-- Dynamic filters will appear here -->
          </div>
          <div id="loading" class="hidden text-center py-4">
            <i class="fas fa-spinner fa-spin text-lg text-gray-500"></i>
            <p class="text-sm text-gray-600 mt-2">Loading items...</p>
          </div>
          <div id="list-view" class="overflow-auto border border-gray-300 rounded">
            <!-- Dynamic content will appear here -->
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="text-sm text-gray-600 text-right px-4 py-1 select-none">
        Smart ERP - by <a href="https://fastrack.in" target="_blank" class="text-blue-600 hover:underline">Fastrack Solutions</a>
      </footer>
    </div>
  </div>

  <script>
    // Field configurations for each doctype
    const DOCTYPE_FIELDS = {
      "Item": ["item_name", "disabled", "item_group", "is_stock_item", "name", "modified"],
      "Vendor": ["vendor_name", "contact_number", "email_address", "name", "modified"],
      "Material Request": ["title", "status", "material_request_type", "name", "modified"],
      "Request for Quotation": ["name", "status", "custom_request_for", "transaction_date", "modified"],
      "Supplier Quotation": ["title", "status", "custom_request_for", "transaction_date", "modified"],
      "Purchase Order": ["supplier", "status", "transaction_date", "grand_total", "name", "modified"],
      "Purchase Receipt": ["supplier", "posting_date", "grand_total", "name", "modified"],
      "Purchase Invoice": ["supplier", "posting_date", "grand_total", "name", "modified"],
      "Payment Entry": ["party", "posting_date","payment_type", "name", "paid_amount", "modified"],
      "Reports": ["name", "report_type", "modified"]
    };

    // Toggle submenu visibility
    function toggleMenu(id) {
      const submenu = document.getElementById(id);
      submenu.classList.toggle('hidden');
      const icon = document.querySelector(`#${id.replace('-submenu', '-toggle')} i.fa-chevron-down`);
      icon.classList.toggle('rotate-180');
    }

    // Format date to DD-MM-YYYY HH:mm
    function formatDate(dateString) {
      if (!dateString) return "N/A";
      const date = new Date(dateString);
      return date.toLocaleString('en-IN', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).replace(',', '');
    }

    // Fetch documents from Frappe API
    async function fetchDocs(doctype) {
      const loading = document.getElementById('loading');
      const listView = document.getElementById('list-view');
      
      loading.classList.remove('hidden');
      listView.innerHTML = '';

      try {
        const fields = DOCTYPE_FIELDS[doctype] || ["name"];
        const response = await fetch(
          `/api/resource/${doctype}?fields=${JSON.stringify(fields)}`,
          { credentials: 'include' }
        );

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const { data } = await response.json();

        // Format dates
        return data.map(record => {
          const formattedRecord = { ...record };
          if (record.modified) formattedRecord.modified = formatDate(record.modified);
          if (record.transaction_date) formattedRecord.transaction_date = formatDate(record.transaction_date);
          return formattedRecord;
        });

      } catch (error) {
        console.error(`Error fetching ${doctype}:`, error);
        return [];
      } finally {
        loading.classList.add('hidden');
      }
    }

    // Render list view with filters
    async function renderListView(doctype, records) {
      const fields = DOCTYPE_FIELDS[doctype] || ["name"];
      const filtersDiv = document.getElementById('filters');
      const listView = document.getElementById('list-view');

      // Generate filters
      filtersDiv.innerHTML = fields.map(field => `
        <div class="mb-2">
          <label class="block text-sm text-gray-700 mb-1">${field.replace(/_/g, ' ')}</label>
          <input 
            type="text" 
            data-field="${field}"
            placeholder="Filter ${field.replace(/_/g, ' ')}..." 
            class="filter-field w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-yellow-400"
            oninput="applyFilters()"
          >
        </div>
      `).join('');

      // Show/hide filters
      filtersDiv.classList.toggle('hidden', fields.length === 0);

      // Render records as a table
      if (records.length === 0) {
        listView.innerHTML = '<div class="p-4 text-center text-gray-500">No records found</div>';
        return;
      }

      listView.innerHTML = `
        <div class="overflow-auto max-h-[calc(100vh-200px)]">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                ${fields.map(field => `
                  <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    ${field.replace(/_/g, ' ')}
                  </th>
                `).join('')}
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              ${records.map(record => `
                <tr class="hover:bg-yellow-50">
                  ${fields.map(field => `
                    <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-700">
                      ${record[field] || 'N/A'}
                    </td>
                  `).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Apply filters to the table
    function applyFilters() {
      const filterInputs = Array.from(document.querySelectorAll('.filter-field'));
      const rows = document.querySelectorAll('#list-view tbody tr');
      
      rows.forEach(row => {
        const cells = Array.from(row.querySelectorAll('td'));
        let isVisible = true;
        
        filterInputs.forEach((input, index) => {
          const filterValue = input.value.toLowerCase();
          const cellValue = cells[index]?.textContent.toLowerCase() || '';
          if (filterValue && !cellValue.includes(filterValue)) {
            isVisible = false;
          }
        });
        
        row.style.display = isVisible ? '' : 'none';
      });
    }

    // Handle sidebar option selection
    async function selectOption(doctype) {
      document.getElementById('main-title').textContent = doctype;
      const records = await fetchDocs(doctype);
      renderListView(doctype, records);
    }

    // Initialize with Item view
    selectOption('Item');
  </script>
</body>
</html>
