<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="csrf-token" content="{{ frappe.session.csrf_token }}" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project Management — SPA</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ------------------------ Custom Theme based on #006767 ------------------------ */
      :root {
        /* Light theme - Based on #006767 */
        --bg: #f8fafa;
        --surface: #ffffff;
        --surface-variant: #f0f7f7;
        --surface-container: #f4f9f9;
        --surface-container-high: #eef5f5;
        --primary: #006767;
        --primary-container: #b3e0e0;
        --on-primary: #ffffff;
        --on-primary-container: #003333;
        --secondary: #4a6767;
        --secondary-container: #cce6e6;
        --on-secondary: #ffffff;
        --on-secondary-container: #1a2626;
        --tertiary: #006767;
        --tertiary-container: #b3e0e0;
        --on-tertiary: #ffffff;
        --on-tertiary-container: #003333;
        --error: #ba1a1a;
        --error-container: #ffdad6;
        --on-error: #ffffff;
        --on-error-container: #410002;
        --outline: #6b7979;
        --outline-variant: #bfcccc;
        --on-surface: #191c1c;
        --on-surface-variant: #3f4848;
        --inverse-surface: #2e3131;
        --inverse-on-surface: #eff1f1;
        --success: #00663d;
        --success-container: #7dffb3;
        --warning: #8a4f00;
        --warning-container: #ffdcc0;
        --shadow: rgba(0, 103, 103, 0.15);
        --glass-bg: rgba(255, 255, 255, 0.8);
        --glass-border: rgba(0, 103, 103, 0.2);
        --blur-bg: rgba(0, 0, 0, 0.4);
        --elevation-1: 0px 1px 2px 0px rgba(0, 103, 103, 0.3),
          0px 1px 3px 1px rgba(0, 103, 103, 0.15);
        --elevation-2: 0px 1px 2px 0px rgba(0, 103, 103, 0.3),
          0px 2px 6px 2px rgba(0, 103, 103, 0.15);
        --elevation-3: 0px 4px 8px 3px rgba(0, 103, 103, 0.15),
          0px 1px 3px 0px rgba(0, 103, 103, 0.3);
        --radius-small: 8px;
        --radius-medium: 12px;
        --radius-large: 16px;
        --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      [data-theme="dark"] {
        /* Dark theme - Based on #006767 */
        --bg: #0f1313;
        --surface: #191c1c;
        --surface-variant: #3f4848;
        --surface-container: #1f2323;
        --surface-container-high: #2a2d2d;
        --primary: #4db3b3;
        --primary-container: #004d4d;
        --on-primary: #003333;
        --on-primary-container: #b3e0e0;
        --secondary: #b0cccc;
        --secondary-container: #334848;
        --on-secondary: #1a2626;
        --on-secondary-container: #cce6e6;
        --tertiary: #4db3b3;
        --tertiary-container: #004d4d;
        --on-tertiary: #003333;
        --on-tertiary-container: #b3e0e0;
        --error: #ffb4ab;
        --error-container: #93000a;
        --on-error: #690005;
        --on-error-container: #ffdad6;
        --outline: #899393;
        --outline-variant: #3f4848;
        --on-surface: #e1e3e3;
        --on-surface-variant: #bfcccc;
        --inverse-surface: #e1e3e3;
        --inverse-on-surface: #2e3131;
        --success: #61d99d;
        --success-container: #00502d;
        --warning: #ffb77c;
        --warning-container: #693800;
        --shadow: rgba(0, 0, 0, 0.4);
        --glass-bg: rgba(25, 28, 28, 0.8);
        --glass-border: rgba(77, 179, 179, 0.2);
        --blur-bg: rgba(0, 0, 0, 0.6);
        --elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15),
          0px 1px 2px 0px rgba(0, 0, 0, 0.3);
        --elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15),
          0px 1px 2px 0px rgba(0, 0, 0, 0.3);
        --elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15),
          0px 1px 3px 0px rgba(0, 0, 0, 0.3);
      }

      /* ------------------------ Base Layout ------------------------ */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--font-family);
        background: var(--bg);
        color: var(--on-surface);
        line-height: 1.6;
      }

      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ------------------------ Blur Effect ------------------------ */
      .blur-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--blur-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }

      .blur-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* ------------------------ Custom Scrollbar ------------------------ */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--surface-variant);
        border-radius: var(--radius-small);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: var(--radius-small);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--secondary);
      }

      /* ------------------------ Top Bar with View Switch ------------------------ */
      .topbar {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--outline-variant);
        box-shadow: var(--elevation-1);
        gap: 16px;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .brand .logo {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-medium);
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-container)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--on-primary);
        font-weight: 700;
        font-size: 20px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--on-surface);
      }

      .brand .subtitle {
        font-size: 14px;
        color: var(--on-surface-variant);
        font-weight: 400;
      }

      /* View Switch Toggle */
      .view-switch {
        display: flex;
        background: var(--surface-variant);
        border-radius: var(--radius-large);
        padding: 4px;
        gap: 2px;
      }

      .view-switch-btn {
        padding: 8px 16px;
        border-radius: var(--radius-medium);
        border: none;
        background: transparent;
        color: var(--on-surface-variant);
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        font-family: var(--font-family);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .view-switch-btn.active {
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: var(--elevation-1);
      }

      .view-switch-btn:hover:not(.active) {
        background: var(--surface-container-high);
        color: var(--on-surface);
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .controls .theme-label {
        font-size: 14px;
        color: var(--on-surface-variant);
        margin-right: 8px;
      }

      /* ------------------------ Workspace Layout - Dynamic ------------------------ */
      .workspace {
        display: grid;
        gap: 0;
        height: calc(100vh - 64px);
        overflow: hidden;
      }

      .workspace.project-view {
        grid-template-columns: 320px 400px 1fr;
      }

      .workspace.task-view {
        grid-template-columns: 500px 1fr; /* Only task list and form */
      }

      .panel {
        background: var(--surface);
        border-right: 1px solid var(--outline-variant);
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .panel:last-child {
        border-right: none;
      }

      .panel .head {
        padding: 20px 24px;
        border-bottom: 1px solid var(--outline-variant);
        font-weight: 600;
        font-size: 16px;
        color: var(--on-surface);
        background: var(--surface-container);
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel .body {
        padding: 16px 24px;
        overflow-y: auto;
        flex: 1;
        height: 100%;
      }

      /* Hide project panel in task view */
      .workspace.task-view #projectsPanel {
        display: none;
      }

      /* Expand task panel in task view */
      .workspace.task-view #tasksPanel {
        width: 500px;
      }

      /* ------------------------ Theme Toggle Button ------------------------ */
      .theme-toggle {
        position: relative;
        width: 60px;
        height: 30px;
        background: var(--outline-variant);
        border-radius: 15px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        padding: 3px;
      }

      .theme-toggle::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        background: var(--surface);
        border-radius: 50%;
        transition: all 0.3s ease;
        box-shadow: var(--elevation-1);
        left: 3px;
      }

      [data-theme="dark"] .theme-toggle {
        background: var(--primary);
      }

      [data-theme="dark"] .theme-toggle::before {
        transform: translateX(30px);
      }

      .theme-toggle-label {
        position: absolute;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.3s ease;
        pointer-events: none;
      }

      .theme-toggle-sun {
        left: 6px;
        opacity: 1;
      }

      .theme-toggle-moon {
        right: 6px;
        opacity: 0;
      }

      [data-theme="dark"] .theme-toggle-sun {
        opacity: 0;
      }

      [data-theme="dark"] .theme-toggle-moon {
        opacity: 1;
      }

      /* ------------------------ Buttons ------------------------ */
      .btn {
        padding: 12px 24px;
        border-radius: var(--radius-large);
        border: none;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        font-family: var(--font-family);
        transition: all 0.2s ease;
        box-shadow: var(--elevation-1);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn:hover {
        box-shadow: var(--elevation-2);
        transform: translateY(-1px);
      }

      .btn-small {
        padding: 8px 16px;
        font-size: 12px;
      }

      .btn-icon {
        padding: 8px;
        border-radius: var(--radius-medium);
        background: transparent;
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }

      .btn-icon:hover {
        background: var(--surface-variant);
        color: var(--primary);
      }

      .ghost {
        background: transparent;
        border: 1px solid var(--outline);
        color: var(--on-surface);
        box-shadow: none;
      }

      .ghost:hover {
        background: var(--surface-variant);
        box-shadow: var(--elevation-1);
      }

      /* ------------------------ Form Elements ------------------------ */
      .search-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        align-items: center;
      }

      .search-input {
        flex: 1;
        padding: 12px 16px;
        border-radius: var(--radius-medium);
        border: 1px solid var(--outline);
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-family);
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .search-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(0, 103, 103, 0.2);
      }

      /* ------------------------ Project Cards with Progress Bar ------------------------ */
      .project-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 18px;
        border-radius: var(--radius-medium);
        border: 1px solid var(--outline-variant);
        margin-bottom: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        background: var(--surface);
      }

      .project-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--elevation-2);
        border-color: var(--primary);
      }

      .project-card.active {
        border-color: var(--primary);
        background: var(--primary-container);
        box-shadow: var(--elevation-2);
      }

      .project-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .project-title {
        font-weight: 600;
        font-size: 16px;
        color: var(--on-surface);
        line-height: 1.3;
        margin-bottom: 4px;
      }

      .project-card.active .project-title {
        color: var(--on-primary-container);
      }

      .project-state {
        font-size: 12px;
        color: var(--on-surface-variant);
        line-height: 1.2;
      }

      .project-card.active .project-state {
        color: var(--on-primary-container);
      }

      .project-status-pill {
        padding: 4px 8px;
        border-radius: var(--radius-large);
        font-weight: 600;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        line-height: 1;
        flex-shrink: 0;
      }

      .project-status-pill.dev {
        background: var(--tertiary-container);
        color: var(--on-tertiary-container);
      }

      .project-status-pill.not-started {
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }

      .project-status-pill.completed {
        background: var(--success-container);
        color: var(--on-primary-container);
      }

      /* Progress Bar in Project Card */
      .project-progress-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .project-progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .project-progress-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--on-surface-variant);
      }

      .project-card.active .project-progress-label {
        color: var(--on-primary-container);
      }

      .project-progress-percentage {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
      }

      .project-card.active .project-progress-percentage {
        color: var(--on-primary-container);
      }

      .project-progress-bar {
        height: 6px;
        background: var(--outline-variant);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }

      .project-card.active .project-progress-bar {
        background: rgba(255, 255, 255, 0.3);
      }

      .project-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--success), var(--primary));
        border-radius: 3px;
        transition: width 0.5s ease;
        position: relative;
      }

      .project-card.active .project-progress-fill {
        background: linear-gradient(
          90deg,
          var(--on-primary-container),
          rgba(255, 255, 255, 0.8)
        );
      }

      /* Animated progress fill effect */
      .project-progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: progressGlow 2s ease-in-out infinite;
      }

      @keyframes progressGlow {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .tags {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      .tag {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: var(--radius-large);
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        font-weight: 500;
        line-height: 1;
      }

      .project-card.active .tag {
        background: rgba(255, 255, 255, 0.2);
        color: var(--on-primary-container);
      }

      /* ------------------------ Inline Progress Task Items with Assigned To ------------------------ */
      .task-item {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 16px 12px;
        border-bottom: 1px solid var(--outline-variant);
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: var(--radius-small);
        margin-bottom: 2px;
        position: relative;
        border: 1px solid transparent; /* default border invisible */
        transition: all 0.5s ease;
      }

      .task-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--elevation-2);
        border: 1px solid var(--primary); /* 4 side border */
      }

      .task-item.active {
        border-color: var(--primary);
        background: var(--primary-container);
        box-shadow: var(--elevation-2);
      }

      .task-item:last-child {
        border-bottom: none;
      }

      .task-item:last-child::after {
        display: none;
      }

      /* Connecting Line between tasks */
      .task-item::after {
        content: "";
        position: absolute;
        left: 27px;
        top: 64px;
        bottom: -16px;
        width: 2px;
        background: var(--outline-variant);
        z-index: 1;
      }

      .task-item.completed::after {
        background: linear-gradient(
          to bottom,
          var(--success),
          var(--outline-variant)
        );
      }

      .task-item.in-progress::after {
        background: linear-gradient(
          to bottom,
          var(--warning),
          var(--outline-variant)
        );
      }

      /* Progress Circle - Inline with Task */
      .task-progress-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
        transition: all 0.3s ease;
        border: 3px solid transparent;
        z-index: 2;
        position: relative;
      }

      .task-progress-circle.open {
        background: var(--surface);
        color: var(--on-surface-variant);
        border-color: var(--outline-variant);
      }

      .task-progress-circle.working {
        background: var(--warning-container);
        color: var(--on-tertiary-container);
        border-color: var(--warning);
        animation: pulse 2s infinite;
      }

      .task-progress-circle.pending {
        background: var(--tertiary-container);
        color: var(--on-tertiary-container);
        border-color: var(--tertiary);
      }

      .task-progress-circle.overdue {
        background: var(--error);
        color: var(--on-error);
        border-color: var(--error);
        animation: shake 0.5s ease-in-out;
      }

      .task-progress-circle.template {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        border-color: var(--secondary);
      }

      .task-progress-circle.completed {
        background: var(--success);
        color: var(--on-primary);
        border-color: var(--success);
        box-shadow: 0 0 15px rgba(0, 102, 61, 0.3);
      }

      .task-progress-circle.cancelled {
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border-color: var(--outline-variant);
      }

      /* Content section */
      .task-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .task-title {
        font-weight: 600;
        font-size: 15px;
        color: var(--on-surface);
        line-height: 1.3;
        margin: 0;
      }

      .task-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .task-dates {
        color: var(--on-surface-variant);
        font-size: 12px;
        line-height: 1.3;
      }

      .task-assigned-to {
        color: var(--primary);
        font-size: 11px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .task-assigned-to::before {
        content: "👤";
        font-size: 10px;
      }

      .task-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        flex-shrink: 0;
      }

      .task-updated {
        font-size: 11px;
        color: var(--on-surface-variant);
      }

      /* Animations */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(138, 79, 0, 0.7);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(138, 79, 0, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(138, 79, 0, 0);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-2px);
        }
        75% {
          transform: translateX(2px);
        }
      }
      /* Enhanced Task Form Styles */
      .common-fields-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }

      .assigned-user-display {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--primary-container);
        padding: 6px 12px;
        border-radius: var(--radius-large);
      }

      .assigned-user-name {
        font-weight: 500;
        color: var(--on-primary-container);
      }

      .task-form-section {
        background: var(--surface-variant);
        border-radius: var(--radius-medium);
        padding: 20px;
        margin-bottom: 20px;
      }

      .location-item,
      .manpower-item,
      .checklist-item {
        background: var(--surface);
        border-radius: var(--radius-small);
        padding: 16px;
        margin-bottom: 12px;
        border: 1px solid var(--outline-variant);
      }

      .location-fields,
      .manpower-counts {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 12px 0;
      }

      .assignment-popup {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }

      .assignment-popup.active {
        opacity: 1;
        visibility: visible;
      }

      .assignment-popup-backdrop {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
      }

      .assignment-popup-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface);
        border-radius: var(--radius-large);
        width: 400px;
        max-width: 90vw;
        max-height: 80vh;
        overflow: hidden;
      }

      .user-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        cursor: pointer;
        border-radius: var(--radius-small);
        margin-bottom: 4px;
      }

      .user-option:hover {
        background: var(--surface-variant);
      }

      .user-option.selected {
        background: var(--primary-container);
        color: var(--on-primary-container);
      }

      /* Progress Summary */
      .progress-summary {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-medium);
        padding: 16px;
        margin-bottom: 20px;
        text-align: center;
      }

      .progress-summary-text {
        font-weight: 600;
        color: var(--primary);
        font-size: 14px;
        margin-bottom: 8px;
      }

      .progress-summary-bar {
        height: 6px;
        background: var(--outline-variant);
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-summary-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--success), var(--primary));
        transition: width 0.5s ease;
        border-radius: 3px;
      }

      /* Badges */
      .badge {
        padding: 4px 8px;
        border-radius: var(--radius-large);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        line-height: 1;
      }

      .badge.open {
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }

      .badge.working {
        background: var(--warning-container);
        color: var(--on-warning-container);
      }

      .badge.pending {
        background: var(--tertiary-container);
        color: var(--on-tertiary-container);
      }

      .badge.overdue {
        background: var(--error-container);
        color: var(--on-error-container);
      }

      .badge.template {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
      }

      .badge.completed {
        background: var(--success-container);
        color: var(--on-primary-container);
      }

      .badge.cancelled {
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }

      /* ------------------------ Task Form with Assigned To ------------------------ */
      .form-panel-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
      }

      .form-panel-content {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 80px;
      }

      .form-field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      .form-field-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--on-surface);
      }

      .form-field-input {
        padding: 12px 16px;
        border-radius: var(--radius-medium);
        border: 1px solid var(--outline);
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-family);
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .form-field-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(0, 103, 103, 0.2);
      }

      .assigned-user-avatar {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary-container);
        color: var(--on-primary-container);
        padding: 6px 12px;
        border-radius: var(--radius-large);
        font-size: 12px;
        font-weight: 500;
        margin-top: 8px;
      }

      .assigned-user-avatar::before {
        content: "👤";
        font-size: 14px;
      }

      /* Fixed Save Section */
      .fixed-save-section {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--glass-border);
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }

      .save-button-enhanced {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: var(--on-primary);
        border: none;
        padding: 14px 32px;
        border-radius: var(--radius-large);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--elevation-2);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .save-button-enhanced:hover {
        transform: translateY(-2px);
        box-shadow: var(--elevation-3);
      }

      .empty {
        padding: 48px 24px;
        text-align: center;
        color: var(--on-surface-variant);
        font-size: 15px;
        line-height: 1.6;
      }

      /* Filter Modal */
      .filter-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        max-width: 90vw;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-large);
        box-shadow: var(--elevation-3);
        z-index: 1001;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -50%) scale(0.8);
        transition: all 0.3s ease;
      }

      .filter-modal.active {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%) scale(1);
      }

      .filter-modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--outline-variant);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .filter-modal-title {
        font-weight: 600;
        font-size: 18px;
        color: var(--on-surface);
      }

      .filter-modal-close {
        background: none;
        border: none;
        font-size: 20px;
        color: var(--on-surface-variant);
        cursor: pointer;
        padding: 4px;
      }

      .filter-modal-body {
        padding: 24px;
      }

      .filter-group {
        margin-bottom: 20px;
      }

      .filter-group:last-child {
        margin-bottom: 0;
      }

      .filter-label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--on-surface);
        margin-bottom: 8px;
      }

      .filter-input {
        width: 100%;
        padding: 12px 16px;
        border-radius: var(--radius-medium);
        border: 1px solid var(--outline);
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-family);
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .filter-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(0, 103, 103, 0.2);
      }

      /* Responsive Design */
      @media (max-width: 1400px) {
        .workspace.project-view {
          grid-template-columns: 300px 380px 1fr;
        }

        .workspace.task-view {
          grid-template-columns: 480px 1fr;
        }
      }

      @media (max-width: 1200px) {
        .workspace.project-view {
          grid-template-columns: 280px 360px 1fr;
        }

        .workspace.task-view {
          grid-template-columns: 450px 1fr;
        }
      }

      @media (max-width: 1000px) {
        .workspace {
          grid-template-columns: 1fr !important;
          grid-template-rows: auto auto auto;
          overflow-y: auto;
        }

        .panel {
          border-right: none;
          border-bottom: 1px solid var(--outline-variant);
          height: auto;
          min-height: 300px;
        }

        .panel:last-child {
          border-bottom: none;
        }

        .panel .body {
          max-height: 400px;
        }

        .task-item {
          flex-direction: row;
          align-items: center;
        }

        .task-item::after {
          display: none;
        }

        .view-switch {
          order: -1;
          margin-right: auto;
        }
      }

      @media (max-width: 768px) {
        .topbar {
          padding: 0 16px;
          flex-wrap: wrap;
          min-height: auto;
          padding: 12px 16px;
        }

        .brand h1 {
          font-size: 16px;
        }

        .brand .subtitle {
          display: none;
        }

        .controls {
          gap: 8px;
        }

        .panel .head,
        .panel .body {
          padding: 16px;
        }

        .fixed-save-section {
          padding: 12px 16px;
        }

        .task-progress-circle {
          width: 32px;
          height: 32px;
          font-size: 12px;
        }

        .task-item::after {
          left: 23px;
        }

        .view-switch-btn {
          padding: 6px 12px;
          font-size: 12px;
        }
      }
      /* --- OPTION 1: Subtle & Professional Glow --- */

      .floating-field {
        position: relative;
        flex: 1;
        min-width: 150px;
      }
      .floating-field input,
      .floating-field select,
      .form-field-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid var(--outline-variant);
        border-radius: 6px;
        outline: none;
        font-size: 13px;
        background: var(--surface);
        color: var(--on-surface);
        transition: box-shadow 0.3s ease-in-out, border-color 0.3s ease-in-out;
      }
      .floating-field label {
        position: absolute;
        top: 10px;
        left: 14px;
        color: var(--on-surface-variant);
        font-weight: 600;
        font-size: 13px;
        pointer-events: none;
        transition: 0.2s ease all;
        background: transparent;
      }
      .floating-field input:focus ~ label,
      .floating-field input:not(:placeholder-shown) ~ label,
      .floating-field select:focus ~ label,
      .floating-field select:not([value=""]) ~ label {
        top: -8px;
        left: 8px;
        font-size: 11px;
        background: var(--surface);
        padding: 0 4px;
      }

      /* --- Editable glow highlight --- */
      .is-editing {
        border-color: #006a69;
        box-shadow: 0 0 0 3px rgba(0, 106, 105, 0.25); /* same color with transparency */
        background-color: var(--surface) !important;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <!-- Blur Overlay -->
      <div class="blur-overlay" id="blurOverlay"></div>

      <div class="topbar">
        <div class="brand">
          <div class="logo">S</div>
          <div>
            <h1>Sahayog Project</h1>
            <div class="subtitle">Welcome, Administrator</div>
          </div>
        </div>

        <!-- View Switch Toggle -->
        <div class="view-switch">
          <button id="projectViewBtn" class="view-switch-btn active">
            📊 Project View
          </button>
          <button id="taskViewBtn" class="view-switch-btn">📋 Task View</button>
        </div>

        <div class="controls">
          <span class="theme-label">Theme</span>
          <button id="themeToggle" class="theme-toggle">
            <span class="theme-toggle-label theme-toggle-sun">☀️</span>
            <span class="theme-toggle-label theme-toggle-moon">🌙</span>
          </button>
          <button id="createProject" class="btn">+ Create Project</button>
        </div>
      </div>

      <div class="workspace project-view" id="workspace">
        <!-- Projects Panel (Hidden in Task View) -->
        <div class="panel" id="projectsPanel">
          <div class="head">
            <span># Projects</span>
            <button id="filterBtn" class="btn-icon" title="Filter Projects">
              🔍
            </button>
          </div>
          <div class="body">
            <div class="search-row">
              <input
                id="projectSearch"
                class="search-input"
                placeholder="Search project name..."
              />
            </div>
            <div id="projectList"></div>
          </div>
        </div>

        <!-- Tasks Panel with Inline Progress -->
        <div class="panel" id="tasksPanel">
          <div class="head">
            <div id="tasksHeader">Select a project to view tasks</div>
          </div>
          <div class="body">
            <!-- Progress Summary -->
            <div
              class="progress-summary"
              id="progressSummary"
              style="display: none"
            >
              <div class="progress-summary-text" id="progressSummaryText">
                0 of 9 tasks completed
              </div>
              <div class="progress-summary-bar">
                <div
                  class="progress-summary-fill"
                  id="progressSummaryFill"
                  style="width: 0%"
                ></div>
              </div>
            </div>

            <!-- Task Search in Task View -->
            <div class="search-row" id="taskSearchRow" style="display: none">
              <input
                id="taskSearch"
                class="search-input"
                placeholder="Search all tasks..."
              />
              <select
                id="taskProjectFilter"
                class="form-field-input"
                style="max-width: 200px"
              >
                <option value="">All Projects</option>
              </select>
            </div>

            <div id="taskList"></div>
          </div>
        </div>

        <!-- Form Panel -->
        <div class="panel" id="formPanel">
          <!-- The head content will be set by JavaScript -->
          <div class="head">Task Management</div>
          <div class="body">
            <div class="form-panel-container">
              <div class="form-panel-content">
                <div id="taskFormContainer">
                  <!-- The dynamic task form will be rendered here -->
                </div>

                <div id="emptyForm" class="empty" style="display: block">
                  Select a task to see its details.
                </div>
              </div>

              <div class="fixed-save-section">
                <div>
                  <div
                    style="font-size: 12px; color: var(--on-surface-variant)"
                    id="lastUpdated"
                  ></div>
                </div>
                <div style="display: flex; gap: 12px; align-items: center">
                  <!-- This button now handles both Edit and Save -->
                  <button
                    id="editSaveBtn"
                    class="save-button-enhanced"
                    style="display: none"
                  >
                    Edit
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter Modal -->
      <div class="filter-modal" id="filterModal">
        <div class="filter-modal-header">
          <h3 class="filter-modal-title">Filter Projects</h3>
          <button class="filter-modal-close" id="closeFilterModal">×</button>
        </div>
        <div class="filter-modal-body">
          <div class="filter-group">
            <label class="filter-label">Zone</label>
            <select id="projectFilterZone" class="filter-input">
              <option value="">All Zones</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">Status</label>
            <select id="projectFilterStatus" class="filter-input">
              <option value="">All Status</option>
              <option value="Not Started">Not Started</option>
              <option value="Under Development">Under Development</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">State</label>
            <select id="projectFilterState" class="filter-input">
              <option value="">All States</option>
            </select>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 24px">
            <button id="clearFilters" class="ghost" style="flex: 1">
              Clear All
            </button>
            <button id="applyFilters" class="btn" style="flex: 1">
              Apply Filters
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      function fetchAllProjects() {
        fetch(
          "/api/method/sahayog.patches.fixtures.get_projects_and_tasks.get_all_projects"
        )
          .then((response) => {
            if (!response.ok)
              throw new Error(`HTTP error! Status: ${response.status}`);
            return response.json();
          })
          .then((res) => {
            if (res.message) {
              console.log("Project API Response:", res.message);

              // Transform API data into the dummy data shape
              data = {
                projects: res.message.map((p, index) => ({
                  id: index + 1, // or use a unique field from API like p.name
                  project_name: p.project_name,
                  name: p.name,
                  zone: p.custom_zone || "-",
                  state: p.custom_region || "-",
                  status: p.custom_branch_status || "-",
                  tasks: [], // placeholder, unless API returns tasks
                })),
              };

              // Call your existing renderer
              renderProjects();
            } else {
              console.error("No projects returned from API.");
            }
          })
          .catch((err) => console.error("Error fetching projects:", err));
      }
      /* ------------------------ Task Templates and Data ------------------------ */
      const STORAGE_KEY = "pm_spa_data_v1";

      // Sample users for assignment
      const USERS = [
        { id: 1, name: "Rajesh Kumar", role: "Project Manager" },
        { id: 2, name: "Priya Sharma", role: "Site Engineer" },
        { id: 3, name: "Amit Patel", role: "Safety Officer" },
        { id: 4, name: "Sunita Singh", role: "Supervisor" },
        { id: 5, name: "Vikram Gupta", role: "Admin Staff" },
      ];

      // Current view state
      let currentView = "project"; // 'project' or 'task'
      let selectedProjectId = null;
      let selectedTaskId = null;

      function getTaskTemplateData(type) {
        switch (type) {
          case "location_details":
            return { locations: [] };
          case "loi_form":
            return {
              ownerDetails: { name: "", address: "", phone: "", email: "" },
              propertyDetails: { address: "", area: "", type: "", value: "" },
              terms: "",
            };
          case "attachment_upload":
            return { attachments: [] };
          case "manpower_checklist":
            return { manpower: [] };
          default:
            return { checklist: [] };
        }
      }

      function initializeProjectTasks() {
        data.projects.forEach((project) => {
          if (project.tasks.length === 0) {
            project.tasks = TASK_TEMPLATES.map((template) => ({
              id: Date.now() + Math.random(),
              title: template.title,
              type: template.type,
              status: "Not Started",
              start: "",
              end: "",
              notes: "",
              assignedTo: USERS[Math.floor(Math.random() * USERS.length)].id, // Random assignment
              updated: Date.now(),
              data: getTaskTemplateData(template.type),
            }));
          } else {
            // Add assignedTo to existing tasks if missing
            project.tasks.forEach((task) => {
              if (!task.assignedTo) {
                task.assignedTo =
                  USERS[Math.floor(Math.random() * USERS.length)].id;
              }
            });
          }
        });
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            data = JSON.parse(raw);
          }
          fetchAllProjects();
        } catch (e) {
          console.warn("load error", e);
          fetchAllProjects();
        }
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      /* ------------------------ Helpers ------------------------ */
      function $id(id) {
        return document.getElementById(id);
      }

      function getUserById(userId) {
        return (
          USERS.find((u) => u.id === userId) || { name: "Unassigned", role: "" }
        );
      }

      function calculateProjectProgress(project) {
        if (!project.tasks || project.tasks.length === 0) return 0;
        const completedTasks = project.tasks.filter(
          (task) => task.status === "Completed"
        ).length;
        return Math.round((completedTasks / project.tasks.length) * 100);
      }

      /* ------------------------ View Management ------------------------ */
      function switchToProjectView() {
        currentView = "project";
        $id("workspace").className = "workspace project-view";
        $id("projectViewBtn").classList.add("active");
        $id("taskViewBtn").classList.remove("active");
        $id("taskSearchRow").style.display = "none";

        // Update header
        const header = $id("tasksHeader");
        const project = getSelectedProject();
        if (project) {
          header.textContent = `${project.name} - Tasks`;
        } else {
          header.textContent = "Select a project to view tasks";
        }

        renderTasksPanel();
      }

      function switchToTaskView() {
        currentView = "task";
        $id("workspace").className = "workspace task-view";
        $id("projectViewBtn").classList.remove("active");
        $id("taskViewBtn").classList.add("active");
        $id("taskSearchRow").style.display = "flex";

        // Update header
        $id("tasksHeader").textContent = "All Tasks";
        $id("progressSummary").style.display = "none";

        renderAllTasks();
        populateTaskProjectFilter();
      }

      function populateTaskProjectFilter() {
        const filter = $id("taskProjectFilter");
        filter.innerHTML = '<option value="">All Projects</option>';
        data.projects.forEach((project) => {
          const option = document.createElement("option");
          option.value = project.id;
          option.textContent = project.name;
          filter.appendChild(option);
        });
      }

      /* ------------------------ Core Functions ------------------------ */
      function showBlur() {
        $id("blurOverlay").classList.add("active");
      }

      function hideBlur() {
        $id("blurOverlay").classList.remove("active");
      }

      function showFilterModal() {
        showBlur();
        $id("filterModal").classList.add("active");
      }

      function hideFilterModal() {
        hideBlur();
        $id("filterModal").classList.remove("active");
      }

      function renderProjectFilters() {
        const zones = Array.from(
          new Set(data.projects.map((p) => p.zone))
        ).sort();
        const states = Array.from(
          new Set(data.projects.map((p) => p.state))
        ).sort();

        const zoneFilter = $id("projectFilterZone");
        zoneFilter.innerHTML = '<option value="">All Zones</option>';
        zones.forEach((z) => {
          const o = document.createElement("option");
          o.value = z;
          o.textContent = z;
          zoneFilter.appendChild(o);
        });

        const stateFilter = $id("projectFilterState");
        stateFilter.innerHTML = '<option value="">All States</option>';
        states.forEach((s) => {
          const o = document.createElement("option");
          o.value = s;
          o.textContent = s;
          stateFilter.appendChild(o);
        });
      }

      function renderProjects() {
        const list = $id("projectList");
        const search = $id("projectSearch").value.trim().toLowerCase();
        const zoneFilter = $id("projectFilterZone").value;
        const statusFilter = $id("projectFilterStatus").value;
        const stateFilter = $id("projectFilterState").value;

        list.innerHTML = "";
        data.projects
          .filter(
            (p) => !search || p.project_name.toLowerCase().includes(search)
          )
          .filter((p) => !zoneFilter || p.zone === zoneFilter)
          .filter((p) => !statusFilter || p.status === statusFilter)
          .filter((p) => !stateFilter || p.state === stateFilter)
          .forEach((p) => {
            const div = document.createElement("div");
            div.className =
              "project-card" + (p.name === selectedProjectId ? " active" : "");

            div.onclick = () => {
              selectProject(p.name);
              renderTasksPanel(p); // ✅ just send project
            };

            const progressPercentage = calculateProjectProgress(p);

            div.innerHTML = `
                <div class="project-header">
                    <div>
                        <div class="project-title">${p.project_name}</div>
                        <div class="project-state">${p.state}</div>
                    </div>
                    <div>
                        ${
                          p.status === "Under Development"
                            ? '<span class="project-status-pill dev">Under Dev</span>'
                            : p.status === "Completed"

      function getProgressClass(status) {
        if (!status) return "open";

        const s = status.toLowerCase();
        if (s === "open") return "open";
        if (s === "working") return "working";
        if (s === "pending review") return "pending";
        if (s === "overdue") return "overdue";
        if (s === "template") return "template";
        if (s === "completed") return "completed";
        if (s === "cancelled") return "cancelled";

        return "open"; // fallback
      }

      function getProgressContent(status, index) {
        if (!status) return (index + 1).toString();

        switch (status.toLowerCase()) {
          case "completed":
            return "✓"; // check mark for done
          case "overdue":
            return "!"; // warning
          case "cancelled":
            return "✕"; // cross mark
          case "working":
            return "⟳"; // progress symbol
          case "pending review":
            return "…"; // ellipsis for pending
          case "template":
            return "T"; // template indicator
          case "open":
            return (index + 1).toString(); // show sequence number
          default:
            return (index + 1).toString();
        }
      }

          );

          // Calculate progress
          const completedTasks = projectTasks.filter(
            (t) => t.status === "Completed"

          const totalTasks = projectTasks.length;
          const progressPercent =
            totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0;

          progressSummaryText.textContent = `${completedTasks} of ${totalTasks} tasks completed (${Math.round(
            progressPercent
          )}%)`;
          progressSummaryFill.style.width = `${progressPercent}%`;

          // Render list
          tList.innerHTML = "";

          projectTasks.forEach((t, index) => {

            const modifiedExact = formatDate(t.modified);

            it.innerHTML = `

        isEditing = editing;
        const form = document.getElementById("task-form-fields");
        if (!form) return;

        const fields = form.querySelectorAll("input, select, textarea");

        fields.forEach((field) => {

      function timeAgo(dateStr) {

        const s = Math.floor((Date.now() - ts) / 1000);

        if (s < 60) return `${s}s ago`;
        if (s < 3600) return `${Math.floor(s / 60)}m ago`;
        if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
        if (s < 172800) return "Yesterday";

        return `${Math.floor(s / 86400)}d ago`;
      }

      /**
       * Converts number to words (for rent display)
       */
      function numberToWords(num) {
        if (!num || isNaN(num)) return "";
        num = parseInt(num);
        if (num === 0) return "Zero";

        const a = [
          "",
          "One",
          "Two",
          "Three",
          "Four",
          "Five",
          "Six",
          "Seven",
          "Eight",
          "Nine",
          "Ten",
          "Eleven",
          "Twelve",
          "Thirteen",
          "Fourteen",
          "Fifteen",
          "Sixteen",
          "Seventeen",
          "Eighteen",
          "Nineteen",
        ];
        const b = [
          "",
          "",
          "Twenty",
          "Thirty",
          "Forty",
          "Fifty",
          "Sixty",
          "Seventy",
          "Eighty",
          "Ninety",
        ];

        const convert = (n) => {
          if (n < 20) return a[n];
          if (n < 100)
            return b[Math.floor(n / 10)] + (n % 10 ? " " + a[n % 10] : "");
          if (n < 1000)
            return (
              a[Math.floor(n / 100)] +
              " Hundred " +
              (n % 100 ? convert(n % 100) : "")
            );
          if (n < 100000)
            return (
              convert(Math.floor(n / 1000)) +
              " Thousand " +
              (n % 1000 ? convert(n % 1000) : "")
            );
          if (n < 10000000)
            return (
              convert(Math.floor(n / 100000)) +
              " Lakh " +
              (n % 100000 ? convert(n % 100000) : "")
            );
          return (
            convert(Math.floor(n / 10000000)) +
            " Crore " +
            (n % 10000000 ? convert(n % 10000000) : "")
          );
        };

        return convert(num).trim();
      }

      async function getCSRFToken() {
        // Try from meta tag first
        const metaTag = document.querySelector('meta[name="csrf-token"]');
        if (metaTag && metaTag.content) {
          console.log("Got CSRF token from meta tag");
          return metaTag.content;
        }

        // Then try from cookies
        const cookieMatch = document.cookie.match(/csrf_token=([^;]+)/);
        if (cookieMatch && cookieMatch[1]) {
          console.log("Got CSRF token from cookies");
          return decodeURIComponent(cookieMatch[1]);
        }

        // Finally try fetching from API
        try {
          console.log("Fetching CSRF token from API");
          const response = await fetch(
            "/api/method/frappe.auth.get_logged_user"
          );

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const token =
            response.headers.get("X-Frappe-CSRF-Token") ||
            response.headers.get("x-frappe-csrf-token");

          if (!token) {
            throw new Error("CSRF token not found in response headers");
          }

          console.log("Got CSRF token from API response");
          return token;
        } catch (error) {
          console.error("CSRF token fetch error:", error);
          throw new Error(
            "Could not get security token. Please refresh the page."
          );
        }
      }

              <button class="btn" id="updateAssignment">Update Assignment</button>
            </div>
          </div>
        `;

        document.body.appendChild(popup);
        setTimeout(() => popup.classList.add("active"), 10);

        let selectedUserId = currentUserId;

        // Handle user selection
        popup.querySelectorAll(".user-option").forEach((option) => {
          option.addEventListener("click", () => {
            popup.querySelectorAll(".user-option").forEach((opt) => {
              opt.classList.remove("selected");
              opt.querySelector(".user-check").textContent = "";
            });
            option.classList.add("selected");
            option.querySelector(".user-check").textContent = "✓";
            selectedUserId = parseInt(option.dataset.userId);
          });
        });

        // Handle close
        const closePopup = () => {
          popup.classList.remove("active");
          setTimeout(() => document.body.removeChild(popup), 300);

        popup.querySelector(".assignment-popup-close").onclick = closePopup;
        popup.querySelector(".assignment-popup-backdrop").onclick = closePopup;
        popup.querySelector("#cancelAssignment").onclick = closePopup;

        // Handle update
        popup.querySelector("#updateAssignment").onclick = () => {
          onUpdate(selectedUserId);
          closePopup();
        };

      // Render task-specific content based on task type
      function renderTaskSpecificContent(task) {
        // Get current URL
        const currentURL = window.location.href;
        const taskNameInURL = task.name.toLowerCase().replace(/\s+/g, "-"); // Convert "Acquisition of the Property" to "acquisition-of-the-property"

        // Check if URL contains task name (case insensitive)
        if (!currentURL.toLowerCase().includes(taskNameInURL)) {
          return ""; // Return empty string if URL doesn't match
        }

        const subject = task.subject || "";
        console.log("Rendering task-specific content for:", subject);

        if (subject.includes("Acquisition of the Property")) {
          return renderLocationDetailsForm(task);
        } else if (subject.includes("Letter of Intent")) {
          return renderLOIForm(task);
        } else if (subject.includes("Agreement and Handover")) {
          return renderAttachmentForm(task);
        } else if (subject.includes("Manpower Recruitment")) {
          return renderManpowerForm(task);
        } else if (subject.includes("Infrastructure Development Work")) {
          return renderInfrastructureForm(task);
        } else if (subject.includes("IT Hardware Installation")) {
          return renderHardwareForm(task);
        } else if (subject.includes("IT Software Installation")) {
          return renderSoftwareForm(task);
        } else if (subject.includes("Handover to Business Team")) {
          return renderHandoverForm(task);
        } else if (subject.includes("Ready for Inauguration")) {
          return renderInaugurationForm(task);
        } else {
          return `<p style="color: var(--on-surface-variant);">
            Task-specific form for <b>${subject}</b> (not mapped yet)
          </p>`;
        }
      }

      // Function to handle adding an image in existing location
      async function handleAddImageForExistingLocation(e, grouped, task) {
        const index = e.target.getAttribute("data-index");
        const locationName = Object.keys(grouped)[index];
        const locationGroup = grouped[locationName];

        const firstLocation = locationGroup[0];
        const estimateRent = firstLocation.estimate_rent || 0;
        const status = locationGroup.some((l) => l.status === "Pending")
          ? "Pending"
          : "Completed";

        // Create file input
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";
        fileInput.style.display = "none";

        fileInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          console.log("Selected file:", file);
          if (!file) return;

          try {
            // Create form data with all required fields
            const formData = new FormData();
            formData.append("task_name", task.name);
            formData.append("location_name", locationName);
            formData.append("estimate_rent", estimateRent);
            formData.append("status", status);
            formData.append("image_file", file);

            // Call API
            const csrfToken = await getCSRFToken();
            console.log("Using CSRF token:", csrfToken);

            const response = await fetch(
              `/api/method/sahayog.patches.fixtures.get_projects_and_tasks.add_image_for_existing_location`,
              {
                method: "POST",
                headers: {
                  "X-Frappe-CSRF-Token": csrfToken,
                },
                body: formData,
              }
            );

            const result = await response.json();

            if (result.message && result.message.success) {
              // Refresh the task data
              const updatedTaskResponse = await fetch(
                `/api/method/sahayog.patches.fixtures.get_projects_and_tasks.get_specific_task?name=${encodeURIComponent(
                  task.name
                )}`
              );
              const updatedTask = await updatedTaskResponse.json();

              // Re-render the form
              const container = document.querySelector(
                ".location-details-container"
              );
              if (container) {
                container.innerHTML = renderLocationDetailsForm(
                  updatedTask.message
                );
              }

              // frappe.show_alert({message: __("Image added successfully"), indicator: "green"}, 3);
            } else {
              throw new Error(
                result.message?.error || "Failed to add location image"
              );
            }
          } catch (error) {
            console.error("Error adding image:", error);
            // frappe.msgprint({title: __("Error"), indicator: "red", message: __("Failed to add image: {0}", [error.message])});
          }
        });

        document.body.appendChild(fileInput);
        fileInput.click();
        document.body.removeChild(fileInput);
      }

      // Function to handle adding a new location with image upload
      async function handleAddNewLocation(task) {
        // Create file input
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";
        fileInput.style.display = "none";

        // Handle file selection
        fileInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          // ask for details AFTER file selection
          const locationName = prompt("Enter Location Name:");
          if (!locationName) return;

          const estimateRent = prompt("Enter Estimate Rent:") || 0;

          try {
            const formData = new FormData();
            formData.append("task_name", task.name);
            formData.append("location_name", locationName);
            formData.append("estimate_rent", estimateRent);
            formData.append("status", "Pending"); // always Pending
            formData.append("image_file", file);

            const csrfToken = await getCSRFToken();
            const response = await fetch(
              `/api/method/sahayog.patches.fixtures.get_projects_and_tasks.add_new_location`,
              {
                method: "POST",
                headers: {
                  "X-Frappe-CSRF-Token": csrfToken,
                },
                body: formData,
              }
            );

            const result = await response.json();
            if (result.message && result.message.success) {
              // Refresh task
              const updatedTaskResponse = await fetch(
                `/api/method/sahayog.patches.fixtures.get_projects_and_tasks.get_specific_task?name=${encodeURIComponent(
                  task.name
                )}`
              );
              const updatedTask = await updatedTaskResponse.json();

              const container = document.querySelector(
                ".location-details-container"
              );
              if (container) {
                container.innerHTML = renderLocationDetailsForm(
                  updatedTask.message
                );
              }
            } else {
              throw new Error(
                result.message?.error || "Failed to add new location"
              );
            }
          } catch (err) {
            console.error("Error adding new location:", err);
          } finally {
            fileInput.remove(); // cleanup input element after use
          }
        });

        // Trigger file dialog
        document.body.appendChild(fileInput);
        fileInput.click();
      }

                "Content-Type": "application/json",
