<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ frappe.session.csrf_token }}" />
    <title>L&amp;D Training Calendar</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-2: #f1f2f4;
        --surface-3: #e9eaed;
        --border: #e3e5e9;
        --ink-1: #1c1d21;
        --ink-2: #4a4b52;
        --ink-3: #87898f;
        --accent: #4f6bed;
        --accent-soft: #eef1fe;
        --accent-ink: #3f57c4;
        --green: #1f9d61;
        --green-soft: #e6f6ee;
        --orange: #e07030;
        --orange-soft: #fdf0e7;
        --gray: #8a8f98;
        --gray-soft: #f0f1f3;
        --radius-sm: 6px;
        --radius-md: 10px;
        --sidebar-w: 230px;
        --sidebar-w-collapsed: 60px;
        --header-h: 56px;
        --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.06);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--ink-1);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 13px;
        color: var(--ink-1);
      }
      button:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-radius: var(--radius-sm);
      }

      /* ---------- App shell ---------- */
      .app {
        height: 100vh;
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
        grid-template-rows: var(--header-h) 1fr;
        grid-template-areas: "sidebar header" "sidebar main";
        transition: grid-template-columns 0.16s ease;
      }
      .app.collapsed {
        grid-template-columns: var(--sidebar-w-collapsed) 1fr;
      }

      /* ---------- Shared controls ---------- */
      .icon-btn {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        color: var(--ink-2);
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--surface-2);
        color: var(--ink-1);
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 13px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink-2);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--surface-2);
        color: var(--ink-1);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .btn-primary:hover {
        background: var(--accent-ink);
        color: #fff;
      }
      .btn svg {
        width: 14px;
        height: 14px;
      }

      .role-badge {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 600;
        vertical-align: middle;
        white-space: nowrap;
      }
      .badge-admin {
        background: #ede9fe;
        color: #6d28d9;
      }
      .badge-trainer {
        background: var(--green-soft);
        color: #15803d;
      }
      .badge-viewer {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .badge-general {
        background: var(--gray-soft);
        color: #4a4b52;
      }

      .field-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 4px;
      }
      .field-input,
      .field-select {
        width: 100%;
        height: 32px;
        padding: 0 9px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        outline: none;
      }
      .field-input:focus,
      .field-select:focus {
        border-color: var(--accent);
      }

      /* ---------- Header ---------- */
      .header {
        grid-area: header;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        min-width: 0;
      }
      .header-title-block {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .header-title-row {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .header-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
      }
      .header-sub {
        font-size: 11.5px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 10px;
        background: var(--surface-2);
        border-radius: var(--radius-sm);
        color: var(--ink-3);
        width: 240px;
        max-width: 26vw;
        margin-left: 10px;
        border: 1px solid transparent;
        transition: border-color 0.12s, background 0.12s;
      }
      .search:focus-within {
        background: var(--surface);
        border-color: var(--accent);
      }
      .search svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .search input {
        border: none;
        background: none;
        outline: none;
        font-size: 13px;
        color: var(--ink-1);
        width: 100%;
      }
      .search input::placeholder {
        color: var(--ink-3);
      }
      .header-spacer {
        flex: 1;
        min-width: 8px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        margin-left: 2px;
        flex-shrink: 0;
        user-select: none;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        grid-area: sidebar;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-top {
        height: var(--header-h);
        display: flex;
        align-items: center;
        padding: 0 10px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        gap: 6px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        height: 36px;
        border-radius: var(--radius-sm);
        padding: 0 4px;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .brand-name {
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .collapse-btn {
        width: 30px;
        height: 30px;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        color: var(--ink-3);
        flex-shrink: 0;
      }
      .collapse-btn:hover {
        background: var(--surface-2);
        color: var(--ink-1);
      }
      .collapse-btn svg {
        width: 16px;
        height: 16px;
        transition: transform 0.16s ease;
      }
      .app.collapsed .collapse-btn svg {
        transform: rotate(180deg);
      }
      .sidebar-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px 10px 16px;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: var(--surface-3);
        border-radius: 8px;
      }
      .sidebar-section + .sidebar-section {
        margin-top: 18px;
      }
      .sidebar-section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-3);
        padding: 0 8px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 8px;
        border-radius: var(--radius-sm);
        color: var(--ink-2);
        width: 100%;
        text-align: left;
        margin-bottom: 2px;
      }
      .nav-item:hover {
        background: var(--surface-2);
        color: var(--ink-1);
      }
      .nav-item.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .nav-item svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }
      .item-label {
        font-size: 13.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .item-count {
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-3);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 1px 7px;
        flex-shrink: 0;
      }
      .nav-item.active .item-count {
        background: #fff;
        color: var(--accent-ink);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .nav-placeholder {
        opacity: 0.55;
        pointer-events: none;
      }
      .app.collapsed .brand-name,
      .app.collapsed .sidebar-section-title,
      .app.collapsed .item-label,
      .app.collapsed .item-count {
        display: none;
      }
      .app.collapsed .nav-item,
      .app.collapsed .collapse-btn,
      .app.collapsed .brand {
        justify-content: center;
        padding: 0;
      }
      .sidebar-footer {
        border-top: 1px solid var(--border);
        padding: 8px 10px;
        flex-shrink: 0;
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .app.collapsed .sidebar-footer {
        text-align: center;
        padding: 8px 4px;
      }

      /* ---------- Main ---------- */
      .main {
        grid-area: main;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      /* Filters */
      .filters-bar {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 12px 20px 10px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 128px;
      }
      .filter-group input,
      .filter-group select {
        height: 30px;
      }
      .filters-bar .filter-group {
        min-width: 116px;
        gap: 3px;
      }
      .filters-bar .field-label {
        font-size: 10px;
        font-weight: 500;
        text-transform: none;
        letter-spacing: 0.01em;
        margin-bottom: 0;
      }
      .filters-bar .filter-group input,
      .filters-bar .filter-group select {
        height: 26px;
        font-size: 12px;
        padding: 0 7px;
      }
      .btn-reset {
        background: transparent;
        border: none;
        color: var(--ink-3);
        font-size: 12px;
        height: 26px;
        padding: 0 6px;
        margin-left: 2px;
      }
      .btn-reset:hover {
        background: transparent;
        color: var(--accent-ink);
      }

      /* Toolbar */
      .cal-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px 0;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .month-nav {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .month-title-block {
        text-align: center;
        flex: 1;
        min-width: 120px;
      }
      .month-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .month-count {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 1px;
      }
      .view-switch {
        display: flex;
        background: var(--surface-2);
        border-radius: var(--radius-sm);
        padding: 3px;
        gap: 2px;
        flex-shrink: 0;
      }
      .view-switch button {
        height: 26px;
        padding: 0 12px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
        border-radius: 5px;
      }
      .view-switch button.active {
        background: var(--surface);
        color: var(--ink-1);
        box-shadow: var(--shadow-1);
      }
      .view-switch button:not(.active):hover {
        color: var(--ink-1);
      }

      /* Status summary */
      .status-summary {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 6px 20px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--ink-2);
        flex-wrap: wrap;
      }
      .status-summary button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 7px;
        border-radius: 6px;
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 500;
        background: transparent;
      }
      .status-summary button:hover {
        background: var(--surface-2);
      }
      .status-summary button.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .status-summary button .sum-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-summary .sum-count {
        font-weight: 700;
      }
      .summary-sep {
        width: 1px;
        height: 12px;
        background: var(--border);
        margin: 0 4px;
      }

      /* Calendar body */
      .cal-body {
        flex: 1;
        display: flex;
        padding: 0 20px 12px;
      }
      .cal-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .weekday-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .weekday-row div {
        padding: 7px 10px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-3);
        text-align: left;
      }
      .weekday-row .wk-num {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        font-weight: 600;
        text-transform: none;
        letter-spacing: normal;
        color: var(--ink-1);
        width: 22px;
        height: 22px;
        line-height: 22px;
        text-align: center;
        border-radius: 50%;
      }
      .weekday-row .wk-num.is-today {
        background: var(--accent);
        color: #fff;
      }

      /* Pixel-perfect grid: 1px gutters drawn by the shared background */
      .month-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-auto-rows: 1fr;
        gap: 1px;
        background: var(--border);
        border-bottom: 1px solid var(--border);
      }
      .day-cell {
        background: var(--surface);
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 92px;
        min-width: 0;
        overflow: hidden;
      }
      .day-cell.other-month {
        background: #fcfcfd;
      }
      .day-cell:hover {
        background: var(--surface-2);
      }
      .day-cell.selected {
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .day-num {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
        border-radius: 50%;
      }
      .day-cell.other-month .day-num {
        color: var(--ink-3);
      }
      .day-cell.is-today .day-num {
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      .day-cell.dimmed {
        opacity: 0.45;
      }

      .event-chip {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        font-size: 11px;
        padding: 3px 5px;
        border-radius: 4px;
        background: var(--surface-2);
        color: var(--ink-1);
        width: 100%;
        min-width: 0;
        cursor: pointer;
        border-left: 2px solid transparent;
      }
      .event-chip:hover {
        background: var(--surface-3);
      }
      .event-chip .status-dot {
        width: 6px;
        height: 6px;
        flex-shrink: 0;
      }
      .event-chip-top {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        min-width: 0;
      }
      .event-chip-title {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }
      .event-chip-time {
        font-size: 9.5px;
        color: var(--ink-3);
        padding-left: 10px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .event-more {
        font-size: 10.5px;
        color: var(--accent-ink);
        padding: 0 5px;
        cursor: pointer;
      }

      /* Week view */
      .week-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px;
        background: var(--border);
        border-bottom: 1px solid var(--border);
      }
      .week-day-col {
        background: var(--surface);
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .week-day-col.is-today {
        background: #fafbff;
      }
      .week-day-col.selected {
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .week-day-col.dimmed {
        opacity: 0.45;
      }
      .week-event {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 11.5px;
        padding: 5px 6px;
        border-radius: 6px;
        background: var(--surface-2);
        line-height: 1.35;
        min-width: 0;
        cursor: pointer;
      }
      .week-event:hover {
        background: var(--surface-3);
      }
      .week-event .status-dot {
        margin-top: 4px;
        flex-shrink: 0;
      }
      .week-event-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        color: var(--ink-1);
      }
      .week-event-time {
        color: var(--ink-3);
        font-size: 10.5px;
      }
      .week-day-empty {
        font-size: 11px;
        color: var(--ink-3);
        padding: 4px 2px;
      }

      /* Day view */
      .day-view {
        flex: 1;
        padding: 14px 4px 20px;
      }
      .day-view-heading {
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .day-view-sub {
        font-size: 13px;
        color: var(--ink-3);
        margin-bottom: 18px;
      }
      .day-view-item {
        display: flex;
        gap: 14px;
        padding: 12px 0;
        border-top: 1px solid var(--border);
        cursor: pointer;
      }
      .day-view-item:hover .day-view-title {
        color: var(--accent-ink);
      }
      .day-view-time {
        width: 80px;
        flex-shrink: 0;
        font-size: 13px;
        color: var(--ink-3);
        padding-top: 2px;
      }
      .day-view-bar {
        width: 3px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .day-view-title {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ink-1);
        margin-bottom: 3px;
      }
      .day-view-meta {
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .day-view-empty {
        font-size: 13px;
        color: var(--ink-3);
        padding: 40px 0;
        text-align: center;
      }

      /* Legend */
      .legend {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 8px 20px 12px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        background: var(--surface);
        flex-wrap: wrap;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--ink-2);
      }

      /* ---------- Overlays / drawer / modal ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.35);
        z-index: 999;
        display: none;
      }
      .overlay.open {
        display: block;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 400px;
        max-width: 92vw;
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 30px rgba(16, 24, 40, 0.12);
        z-index: 1000;
        transform: translateX(102%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .drawer-head .title {
        flex: 1;
        min-width: 0;
      }
      .drawer-head h3 {
        font-size: 15.5px;
        font-weight: 700;
        margin: 4px 0 4px;
        line-height: 1.3;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 20px;
      }
      .drawer-section {
        margin-bottom: 16px;
      }
      .drawer-section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-3);
        margin-bottom: 8px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 14px;
      }
      .meta-item .k {
        font-size: 11px;
        color: var(--ink-3);
        margin-bottom: 1px;
      }
      .meta-item .v {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-1);
      }
      .check-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 6px;
        background: var(--surface);
      }
      .check-item.done {
        background: var(--green-soft);
        border-color: #bbe7cf;
      }
      .check-item input {
        width: 15px;
        height: 15px;
        accent-color: var(--green);
        cursor: pointer;
        flex-shrink: 0;
      }
      .check-item .ck-label {
        flex: 1;
        font-size: 13px;
      }
      .check-item .ck-val {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
      }
      .check-item.done .ck-val {
        color: #15803d;
      }
      .progress-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .progress-track {
        flex: 1;
        height: 5px;
        background: var(--surface-3);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        transition: width 0.2s ease;
      }
      .progress-fill.complete {
        background: var(--green);
      }
      .progress-pct {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-2);
        min-width: 38px;
        text-align: right;
      }
      .remarks-box {
        width: 100%;
        min-height: 64px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 7px 9px;
        font-size: 13px;
        resize: vertical;
        outline: none;
      }
      .remarks-box:focus {
        border-color: var(--accent);
      }
      .remarks-read {
        font-size: 13px;
        color: var(--ink-2);
        background: var(--surface-2);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        white-space: pre-wrap;
      }
      .drawer-actions {
        padding: 12px 18px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 999px;
        padding: 2px 9px;
      }
      .chip-green {
        background: var(--green-soft);
        color: #15803d;
      }
      .chip-orange {
        background: var(--orange-soft);
        color: #b45309;
      }
      .chip-blue {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .chip-gray {
        background: var(--gray-soft);
        color: #4a4b52;
      }

      .field-hint {
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-3);
        margin-left: 6px;
      }
      .participant-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .participant-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        background: var(--accent-soft);
        color: var(--accent-ink);
        border-radius: 999px;
        padding: 3px 10px;
      }
      .participant-chip button {
        background: none;
        border: none;
        cursor: pointer;
        color: inherit;
        font-size: 14px;
        line-height: 1;
        padding: 0;
        opacity: 0.7;
      }
      .participant-chip button:hover {
        opacity: 1;
      }

      /* Modal */
      .modal-wrap {
        position: fixed;
        inset: 0;
        z-index: 1001;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-wrap.open {
        display: flex;
      }
      .modal {
        width: 480px;
        max-width: 92vw;
        max-height: 90vh;
        overflow-y: auto;
        background: var(--surface);
        border-radius: var(--radius-md);
        box-shadow: 0 18px 50px rgba(16, 24, 40, 0.18);
        padding: 18px 20px 16px;
      }
      #addModal .modal {
        width: 96vw;
        max-width: 96vw;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .modal-head h3 {
        font-size: 15.5px;
        font-weight: 700;
        margin: 0;
      }
      .modal-close {
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        color: var(--ink-3);
        display: grid;
        place-items: center;
      }
      .modal-close:hover {
        background: var(--surface-2);
        color: var(--ink-1);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .form-row.full {
        grid-template-columns: 1fr;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      .check-inline {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .check-inline input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #1c1d21;
        color: #fff;
        padding: 9px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        z-index: 1300;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 1080px) {
        .search {
          width: 170px;
        }
      }
      @media (max-width: 920px) {
        :root {
          --sidebar-w: 200px;
        }
        .search {
          display: none;
        }
      }
      @media (max-width: 700px) {
        .cal-body {
          padding: 0 10px 8px;
        }
        .filters-bar {
          padding: 10px 12px 8px;
        }
        .day-cell {
          min-height: 64px;
          padding: 4px;
        }
        .event-chip-time,
        .event-chip .status-dot {
          display: none;
        }
        .view-switch button {
          padding: 0 9px;
        }
        .month-title {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>

              <span class="item-label">Trainings</span>
            </button>
            <button class="nav-item nav-placeholder" title="Reports — MIS & consolidated reporting (backend phase)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18" /><path d="M7 15l4-4 3 3 5-6" /></svg>
              <span class="item-label">Reports</span>

          </div>

          <div class="sidebar-section">

            <button class="nav-item" data-status="draft" title="Draft">

            <button class="nav-item" data-status="inprogress" title="In progress">

            <button class="nav-item" data-status="completed" title="Completed">

          </div>
        </div>

        <div class="sidebar-footer" id="sidebarFooter"></div>
      </aside>

      <!-- ===== Header ===== -->
      <header class="header">
        <div class="header-title-block">
          <div class="header-title-row">
            <h1 class="header-title">L&amp;D Training Calendar</h1>
            <span class="role-badge badge-general" id="roleBadge">&nbsp;</span>
          </div>
          <div class="header-sub" id="headerSub">&nbsp;</div>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
          <input type="text" id="searchInput" placeholder="Search trainings" />
        </div>
        <div class="header-spacer"></div>
        <div class="header-right">
          <button class="icon-btn" id="misBtn" title="Monthly MIS report" style="display: none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 00-5-5H8a5 5 0 00-5 5v2" /><path d="M3 12h5l2 3h4l2-3h5v5a2 2 0 01-2 2H5a2 2 0 01-2-2z" /></svg>
          </button>
          <button class="icon-btn" title="Notifications">

          </button>

      <!-- ===== Main ===== -->
      <main class="main">
        <div class="filters-bar" id="filtersBar">
          <div class="filter-group">
            <label class="field-label">Zone</label>
            <select class="field-select" id="fil-zone"><option value="">All Zones</option></select>
          </div>
          <div class="filter-group">
            <label class="field-label">Region</label>
            <select class="field-select" id="fil-region"><option value="">All Regions</option></select>
          </div>
          <div class="filter-group">
            <label class="field-label">District</label>
            <select class="field-select" id="fil-district"><option value="">All Districts</option></select>
          </div>
          <div class="filter-group">
            <label class="field-label">Branch</label>
            <select class="field-select" id="fil-branch"><option value="">All Branches</option></select>
          </div>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>
            Reset
          </button>

        <div class="cal-toolbar">
          <button class="btn" id="todayBtn">Today</button>
          <div class="month-nav">
            <button class="icon-btn" id="prevBtn" title="Previous">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
            </button>
            <button class="icon-btn" id="nextBtn" title="Next">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
            </button>
          </div>
          <div class="month-title-block">

            <div class="month-count" id="monthCount"></div>

        <div class="cal-body">

        </div>

        <div class="legend">
          <span class="legend-item"><span class="status-dot" style="background: var(--green)"></span> Completed</span>
          <span class="legend-item"><span class="status-dot" style="background: var(--orange)"></span> In Progress</span>
          <span class="legend-item"><span class="status-dot" style="background: var(--accent)"></span> Upcoming</span>
          <span class="legend-item"><span class="status-dot" style="background: var(--ink-3)"></span> Pending</span>
        </div>
      </main>
    </div>

    <!-- Drawer: training details -->
    <div class="overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head" id="drawerHead"></div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-actions" id="drawerActions"></div>
    </div>

    <!-- Modal: add training -->
    <div class="modal-wrap" id="addModal">
      <div class="modal">
        <div class="modal-head">
          <h3>Add Training</h3>
          <button class="modal-close" data-close="addModal" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M18 6L6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="form-row full">
          <div>
            <label class="field-label">Training Program / Title *</label>
            <input class="field-input" id="new-program" placeholder="E.g. Product Knowledge" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label">From Date *</label>
            <input class="field-input" type="date" id="new-from-date" />
          </div>
          <div>
            <label class="field-label">To Date *</label>
            <input class="field-input" type="date" id="new-to-date" />

        <div class="form-row">

              display:none;position:absolute;top:100%;left:0;right:0;z-index:200;
              background:var(--surface);border:1px solid var(--border);border-top:none;
              border-radius:0 0 var(--radius-sm) var(--radius-sm);
              box-shadow:0 4px 12px rgba(16,24,40,0.1);
              max-height:180px;overflow-y:auto;

        </div>
        <div class="form-row full">
          <div style="position:relative">

            <input class="field-input" id="new-participant-search" placeholder="Search employee by name…" autocomplete="off" />
            <div id="participant-dropdown" style="
              display:none;position:absolute;top:100%;left:0;right:0;z-index:200;
              background:var(--surface);border:1px solid var(--border);border-top:none;
              border-radius:0 0 var(--radius-sm) var(--radius-sm);
              box-shadow:0 4px 12px rgba(16,24,40,0.1);

          </div>

          <div id="participant-chips" class="participant-chips"></div>

        <div class="form-row">
          <div>
            <label class="field-label">Zone</label>
            <input class="field-input" id="new-zone" readonly placeholder="—" style="background:var(--surface-2);color:var(--ink-3);cursor:default;" />
          </div>
          <div>
            <label class="field-label">Region</label>

        <div class="form-row">
          <div>

    <!-- Modal: MIS report preview (admin) -->
    <div class="modal-wrap" id="misModal">
