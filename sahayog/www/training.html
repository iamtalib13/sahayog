          </button>
        </div>
        <div id="misBody"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // Backend: talks to sahayog.agent_and_bdo.ld_training_api (Training doctype).
      (function () {
        "use strict";

        /* ---------- Backend API helper ---------- */
        var csrf = (document.querySelector('meta[name="csrf-token"]') || {}).content || "";
        function api(method, args) {
          return fetch("/api/method/sahayog.agent_and_bdo.ld_training_api." + method, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": csrf },
            body: JSON.stringify(args || {}),
          })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d.exc_type) throw new Error(d.exception || d.exc_type);
              return d.message;
            });
        }

        /* ---------- Status metadata (single source of truth) ---------- */
        var STATUS_ORDER = ["draft", "upcoming", "inprogress", "completed", "pending"];
        var STATUS_META = {
          draft: { color: "#8a8f98", label: "Draft" },
          upcoming: { color: "#4f6bed", label: "Upcoming" },
          inprogress: { color: "#e07030", label: "In Progress" },
          completed: { color: "#1f9d61", label: "Completed" },
          pending: { color: "#a0a5b0", label: "Pending" },
        };
        var CHECK_FIELDS = [
          { key: "training_delivered", label: "Training Delivered" },
          { key: "attendance_marked", label: "Attendance Marked" },
          { key: "pre_assessment_taken", label: "Pre-Assessment Taken" },
          { key: "post_assessment_taken", label: "Post-Assessment Taken" },
          { key: "feedback_taken", label: "Feedback Taken" },
        ];

        var ROLES = {
          ld_admin: { label: "L&D Admin", badge: "badge-admin", sub: "Admin View - All zones, full access", canAdd: true, canEdit: true, showBudget: true, showMis: true },
          trainer: { label: "Trainer", badge: "badge-trainer", sub: "Trainer Dashboard - update training status after completion", canAdd: true, canEdit: true, showBudget: false, showMis: false },
          viewer: { label: "Leadership", badge: "badge-viewer", sub: "Leadership View - read-only training calendar", canAdd: false, canEdit: false, showBudget: false, showMis: false },
          general: { label: "General", badge: "badge-general", sub: "General View", canAdd: false, canEdit: false, showBudget: false, showMis: false },
        };

        /* ---------- State ---------- */
        var state = {
          role: "ld_admin",
          viewMode: "month",
          viewDate: null,
          selectedDate: null,
          calEvents: [],
          calFilters: { zone: "", region: "", district: "", branch: "" },
          statusFilter: null,
          search: "",
          currentEvent: null,
          loadedMonth: "",
          branchOptions: [],
          allEmployees: [],
          selectedParticipants: [],
        };

        var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        var WEEKDAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        var today = new Date();
        today.setHours(0, 0, 0, 0);

        function iso(offsetDays) {
          var d = new Date(today);
          d.setDate(d.getDate() + offsetDays);
          return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }
        function todayIso() { return iso(0); }

        /* ---------- Pure helpers ---------- */
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }
        function fmtTime(t) {
          if (!t) return "";
          var p = String(t).split(":");
          var h = parseInt(p[0], 10), m = p[1] || "00";
          var ap = h >= 12 ? "PM" : "AM";
          h = h % 12 || 12;
          return h + ":" + m + " " + ap;
        }
        function inr(n) {
          n = Number(n || 0);
          return "\u20B9" + n.toLocaleString("en-IN");
        }
        function completionScore(ev) {
          return CHECK_FIELDS.filter(function (f) { return ev[f.key]; }).length;
        }
        function evStart(ev) { return ev.from_date || ev.date || ""; }
        function evEnd(ev) { return ev.to_date || ev.from_date || ev.date || ""; }
        function statusOf(ev) {
          if (ev.docstatus === 0) return "draft";
          var s = completionScore(ev);
          if (s === 5) return "completed";
          if (s > 0) return "inprogress";
          return evEnd(ev) >= todayIso() ? "upcoming" : "pending";
        }
        function monthOf(d) { return d.getMonth(); }
        function yearOf(d) { return d.getFullYear(); }
        function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
        function startOfWeek(d) {
          var s = new Date(d);
          s.setDate(s.getDate() - s.getDay());
          s.setHours(0, 0, 0, 0);
          return s;
        }
        function isoOf(d) {
          return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }

        function filteredEvents() {
          var f = state.calFilters;
          var q = (state.search || "").trim().toLowerCase();
          return state.calEvents.filter(function (ev) {
            if (f.zone && ev.zone !== f.zone) return false;
            if (f.region && ev.region !== f.region) return false;
            if (f.district && ev.district !== f.district) return false;
            if (f.branch && !(ev.branch || "").toLowerCase().includes(f.branch.toLowerCase())) return false;
            if (q) {
              var hay = [ev.training_program, ev.topic, ev.trainer_name, ev.training_location, ev.zone, ev.region, ev.district, ev.branch].join(" ").toLowerCase();
              if (hay.indexOf(q) === -1) return false;
            }
            return true;
          });
        }
        function statusCounts(events) {
          var c = { draft: 0, upcoming: 0, inprogress: 0, completed: 0, pending: 0 };
          events.forEach(function (ev) { c[statusOf(ev)]++; });
          return c;
        }

        /* ---------- Role UI ---------- */
        function role() { return ROLES[state.role]; }

        function setupRoleUI() {
          var r = role();
          var badge = document.getElementById("roleBadge");
          badge.textContent = r.label;
          badge.className = "role-badge " + r.badge;
          document.getElementById("headerSub").textContent = r.sub;
          document.getElementById("avatar").textContent = r.label.charAt(0);
          document.getElementById("sidebarFooter").textContent = r.label;
          var addBtn = document.getElementById("btn-add-training");
          if (addBtn) addBtn.style.display = r.canAdd ? "inline-flex" : "none";
          document.getElementById("misBtn").style.display = r.showMis ? "grid" : "none";
        }

        /* ---------- Filters ---------- */
        function fillSelect(id, items, placeholder) {
          var el = document.getElementById(id);
          if (!el) return;
          el.innerHTML = "";
          if (placeholder !== undefined) {
            var o = document.createElement("option");
            o.value = "";
            o.textContent = placeholder;
            el.appendChild(o);
          }
          items.forEach(function (v) {
            var op = document.createElement("option");
            op.value = v;
            op.textContent = v;
            el.appendChild(op);
          });
        }

        function loadGeo() {
          return api("get_geo_options").then(function (opts) {
            var zones = opts.zones || [], regions = opts.regions || [], districts = opts.districts || [], branches = opts.branches || [];
            fillSelect("fil-zone", zones, "All Zones");
            fillSelect("fil-region", regions, "All Regions");
            fillSelect("fil-district", districts, "All Districts");
            fillSelect("fil-branch", branches, "All Branches");
            state.branchOptions = branches;
            return api("get_trainer_options", { enabled_only: 1 });
          }).then(function (employees) {
            state.allEmployees = Array.isArray(employees) ? employees : [];
          });
        }

        function loadData(force) {
          var anchor = state.viewMode === "month" ? state.viewDate : state.selectedDate;
          if (!anchor) anchor = new Date(today);
          var y = anchor.getFullYear();
          var m = anchor.getMonth() + 1;
          var key = y + "-" + String(m).padStart(2, "0");
          if (!force && key === state.loadedMonth) { render(); return; }
          state.loadedMonth = key;
          var f = state.calFilters;
          api("get_calendar_data", {
            year: y, month: m,
            zone: f.zone || null, region: f.region || null,
            district: f.district || null, branch: f.branch || null
          }).then(function (evs) {
            state.calEvents = Array.isArray(evs) ? evs : [];
            render();
          }).catch(function (err) {
            state.calEvents = [];
            render();
            showToast("Could not load calendar: " + err.message);
          });
        }

        function setupFilters() {
          document.getElementById("fil-zone").onchange = function (e) { state.calFilters.zone = e.target.value; state.selectedDate = pickRelevantDate(); loadData(true); };
          document.getElementById("fil-region").onchange = function (e) { state.calFilters.region = e.target.value; state.selectedDate = pickRelevantDate(); loadData(true); };
          document.getElementById("fil-district").onchange = function (e) { state.calFilters.district = e.target.value; state.selectedDate = pickRelevantDate(); loadData(true); };
          document.getElementById("fil-branch").onchange = function (e) { state.calFilters.branch = e.target.value; state.selectedDate = pickRelevantDate(); loadData(true); };
          document.getElementById("btn-reset").onclick = function () {
            state.calFilters = { zone: "", region: "", district: "", branch: "" };
            state.statusFilter = null;
            state.search = "";
            document.getElementById("searchInput").value = "";
            ["fil-zone", "fil-region", "fil-district", "fil-branch"].forEach(function (s) { document.getElementById(s).value = ""; });
            state.selectedDate = new Date(today);
            loadData(true);
          };
        }
        function pickRelevantDate() {
          var evs = filteredEvents();
          if (!evs.length) return new Date(today);
          var dates = evs.map(function (e) { return evStart(e); }).sort();
          var next = dates.find(function (d) { return d >= todayIso(); }) || dates[dates.length - 1];
          var p = next.split("-");
          return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        }

        /* ---------- Render ---------- */
        function render() {
          updateSidebarCounts();
          renderStatusSummary();
          var el = document.getElementById("calContent");
          el.innerHTML = "";
          if (state.viewMode === "month") renderMonthView();
          else if (state.viewMode === "week") renderWeekView();
          else renderDayView();
        }

        function eventsOn(dateIso) {
          var statusOk = state.statusFilter
            ? function (ev) { return statusOf(ev) === state.statusFilter; }
            : function () { return true; };
          return filteredEvents()
            .filter(function (ev) { return evStart(ev) <= dateIso && evEnd(ev) >= dateIso && statusOk(ev); })
            .sort(function (a, b) { return a.time.localeCompare(b.time); });
        }

        function monthCountLabel() {
          var evs = filteredEvents().filter(function (ev) {
            return evStart(ev).slice(0, 7) === state.viewDate.getFullYear() + "-" + String(state.viewDate.getMonth() + 1).padStart(2, "0");
          });
          return evs.length + " training" + (evs.length === 1 ? "" : "s") + " scheduled";
        }

        function renderMonthView() {
          state.viewDate = state.viewDate || new Date(today.getFullYear(), today.getMonth(), 1);
          document.getElementById("monthTitle").textContent = MONTHS[monthOf(state.viewDate)] + " " + yearOf(state.viewDate);
          document.getElementById("monthCount").textContent = monthCountLabel();

          var content = document.getElementById("calContent");
          var row = document.createElement("div");
          row.className = "weekday-row";
          WEEKDAYS.forEach(function (w) {
            var d = document.createElement("div");
            d.textContent = w;
            row.appendChild(d);
          });
          content.appendChild(row);

          var grid = document.createElement("div");
          grid.className = "month-grid";

          var first = new Date(yearOf(state.viewDate), monthOf(state.viewDate), 1);
          var start = new Date(first);
          start.setDate(start.getDate() - first.getDay());

          var isFiltered = state.statusFilter !== null;
          for (var i = 0; i < 42; i++) {
            var cellDate = new Date(start);
            cellDate.setDate(start.getDate() + i);
            var dateIso = isoOf(cellDate);
            var evs = eventsOn(dateIso);
            var other = cellDate.getMonth() !== monthOf(state.viewDate);

            var cell = document.createElement("div");
            cell.className = "day-cell";
            if (other) cell.classList.add("other-month");
            if (sameDay(cellDate, today)) cell.classList.add("is-today");
            if (sameDay(cellDate, state.selectedDate)) cell.classList.add("selected");
            if (isFiltered && evs.length === 0 && !other) cell.classList.add("dimmed");

            var num = document.createElement("div");
            num.className = "day-num";
            num.textContent = cellDate.getDate();
            cell.appendChild(num);

            evs.slice(0, 2).forEach(function (ev) {
              cell.appendChild(eventChip(ev));
            });
            if (evs.length > 2) {
              var more = document.createElement("div");
              more.className = "event-more";
              more.textContent = "+" + (evs.length - 2) + " more";
              more.onclick = function () {
                var p = dateIso.split("-");
                state.selectedDate = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                state.viewMode = "day";
                syncViewSwitch();
                render();
              };
              cell.appendChild(more);
            }

            cell.addEventListener("click", function (d) { return function () {
              state.selectedDate = d;
              if (state.viewMode === "month" && d.getMonth() !== monthOf(state.viewDate)) {
                state.viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
              }
              render();
            }; }(new Date(cellDate)));
            grid.appendChild(cell);
          }
          content.appendChild(grid);
        }

        function eventChip(ev) {
          var st = statusOf(ev);
          var meta = STATUS_META[st];
          var chip = document.createElement("div");
          chip.className = "event-chip";
          chip.style.borderLeftColor = meta.color;
          chip.innerHTML =
            '<span class="event-chip-top">' +
            '<span class="status-dot" style="background:' + meta.color + '"></span>' +
            '<span class="event-chip-title">' + esc(ev.training_program || ev.topic || "Training") + "</span>" +
            "</span>" +
            '<span class="event-chip-time">' + esc(ev.time || "") + "</span>";
          chip.addEventListener("click", function (e) {
            e.stopPropagation();
            openDrawer(ev);
          });
          return chip;
        }

        function renderWeekView() {
          var anchor = state.selectedDate || new Date(today);
          var weekStart = startOfWeek(anchor);
          var weekEnd = new Date(weekStart);
          weekEnd.setDate(weekEnd.getDate() + 6);

          var title;
          if (weekStart.getMonth() === weekEnd.getMonth()) {
            title = MONTH_SHORT[weekStart.getMonth()] + " " + weekStart.getDate() + " - " + weekEnd.getDate() + ", " + weekStart.getFullYear();
          } else {
            title = MONTH_SHORT[weekStart.getMonth()] + " " + weekStart.getDate() + " - " + MONTH_SHORT[weekEnd.getMonth()] + " " + weekEnd.getDate() + ", " + weekEnd.getFullYear();
          }
          document.getElementById("monthTitle").textContent = title;

          var visible = filteredEvents().filter(function (ev) {
            var d = new Date(parseInt(evStart(ev).slice(0, 4), 10), parseInt(evStart(ev).slice(5, 7), 10) - 1, parseInt(evStart(ev).slice(8, 10), 10));
            return d >= weekStart && d <= weekEnd;
          });
          document.getElementById("monthCount").textContent = visible.length + " training" + (visible.length === 1 ? "" : "s") + " scheduled";

          var content = document.getElementById("calContent");
          var row = document.createElement("div");
          row.className = "weekday-row";
          for (var i = 0; i < 7; i++) {
            var d = new Date(weekStart);
            d.setDate(d.getDate() + i);
            var dCell = document.createElement("div");
            dCell.innerHTML = WEEKDAYS[i] + '<span class="wk-num' + (sameDay(d, today) ? " is-today" : "") + '">' + d.getDate() + "</span>";
            row.appendChild(dCell);
          }
          content.appendChild(row);

          var grid = document.createElement("div");
          grid.className = "week-grid";
          var isFiltered = state.statusFilter !== null;

          for (var j = 0; j < 7; j++) {
            var day = new Date(weekStart);
            day.setDate(day.getDate() + j);
            var dateIso = isoOf(day);
            var evs = eventsOn(dateIso);

            var col = document.createElement("div");
            col.className = "week-day-col";
            if (sameDay(day, today)) col.classList.add("is-today");
            if (sameDay(day, state.selectedDate)) col.classList.add("selected");
            if (isFiltered && evs.length === 0) col.classList.add("dimmed");

            if (evs.length === 0) {
              var empty = document.createElement("div");
              empty.className = "week-day-empty";
              empty.textContent = "No trainings";
              col.appendChild(empty);
            } else {
              evs.forEach(function (ev) {
                var st = statusOf(ev);
                var item = document.createElement("div");
                item.className = "week-event";
                item.innerHTML =
                  '<span class="status-dot" style="background:' + STATUS_META[st].color + '"></span>' +
                  '<span><span class="week-event-title">' + esc(ev.training_program || ev.topic || "Training") + "</span>" +
                  '<br><span class="week-event-time">' + esc(ev.time || "") + (ev.training_location ? " • " + esc(ev.training_location) : "") + "</span></span>";
                item.addEventListener("click", function (e) {
                  e.stopPropagation();
                  openDrawer(ev);
                });
                col.appendChild(item);
              });
            }

            col.addEventListener("click", function (d) { return function () {
              state.selectedDate = d;
              render();
            }; }(new Date(day)));
            grid.appendChild(col);
          }
          content.appendChild(grid);
        }

        function renderDayView() {
          var d = state.selectedDate || new Date(today);
          document.getElementById("monthTitle").textContent = WEEKDAY_NAMES[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + " " + d.getFullYear();

          var evs = eventsOn(isoOf(d));
          document.getElementById("monthCount").textContent = evs.length + " training" + (evs.length === 1 ? "" : "s") + " scheduled";

          var content = document.getElementById("calContent");
          var wrap = document.createElement("div");
          wrap.className = "day-view";

          var head = document.createElement("div");
          head.className = "day-view-heading";
          head.textContent = WEEKDAY_NAMES[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
          wrap.appendChild(head);

          if (evs.length === 0) {
            var empty = document.createElement("div");
            empty.className = "day-view-empty";
            empty.textContent = "No trainings scheduled for this day";
            wrap.appendChild(empty);
          } else {
            evs.forEach(function (ev) {
              var st = statusOf(ev);
              var item = document.createElement("div");
              item.className = "day-view-item";
              item.innerHTML =
                '<div class="day-view-time">' + esc(ev.time || "All day") + "</div>" +
                '<div class="day-view-bar" style="background:' + STATUS_META[st].color + '"></div>' +
                "<div>" +
                '<div class="day-view-title">' + esc(ev.training_program || ev.topic || "Training") + "</div>" +
                '<div class="day-view-meta">' + esc(STATUS_META[st].label) +
                (ev.training_location ? " &middot; " + esc(ev.training_location) : "") +
                (ev.trainer_name ? " &middot; " + esc(ev.trainer_name) : "") + "</div></div>";
              item.addEventListener("click", function (e) {
                e.stopPropagation();
                openDrawer(ev);
              });
              wrap.appendChild(item);
            });
          }
          content.appendChild(wrap);
        }

        function syncViewSwitch() {
          document.querySelectorAll("#viewSwitch button").forEach(function (b) {
            b.classList.toggle("active", b.dataset.view === state.viewMode);
          });
        }

        function updateSidebarCounts() {
          var counts = statusCounts(filteredEvents());
          STATUS_ORDER.forEach(function (k) {
            var el = document.getElementById("count-" + k);
            if (el) el.textContent = counts[k];
          });
          document.querySelectorAll(".nav-item[data-status]").forEach(function (b) {
            b.classList.toggle("active", b.dataset.status === state.statusFilter);
          });
        }

        function renderStatusSummary() {
          var counts = statusCounts(filteredEvents());
          var el = document.getElementById("statusSummary");
          el.innerHTML = "";
          var order = ["upcoming", "inprogress", "completed", "pending"];
          order.forEach(function (k, i) {
            var m = STATUS_META[k];
            var b = document.createElement("button");
            b.className = state.statusFilter === k ? "active" : "";
            b.innerHTML =
              '<span class="sum-dot" style="background:' + m.color + '"></span>' +
              "<span>" + m.label + "</span>" +
              '<span class="sum-count">' + counts[k] + "</span>";
            b.addEventListener("click", function () {
              state.statusFilter = state.statusFilter === k ? null : k;
              render();
            });
            el.appendChild(b);
            if (i < order.length - 1) {
              var sep = document.createElement("span");
              sep.className = "summary-sep";
              el.appendChild(sep);
            }
          });
        }

        /* ---------- Drawer (training details) ---------- */
        var drawer = document.getElementById("drawer");
        var drawerOverlay = document.getElementById("drawerOverlay");

        function closeDrawer() {
          drawer.classList.remove("open");
          drawerOverlay.classList.remove("open");
          drawer.setAttribute("aria-hidden", "true");
        }
        function openDrawer(ev) {
          state.currentEvent = ev;
          var r = role();
          var st = statusOf(ev);
          var meta = STATUS_META[st];
          var score = completionScore(ev);
          var pct = Math.round((score / 5) * 100);

          var chipClass = st === "completed" ? "chip-green" : st === "inprogress" ? "chip-orange" : st === "upcoming" ? "chip-blue" : "chip-gray";

          var head =
            '<div class="title">' +
            '<span class="chip ' + chipClass + '"><span class="status-dot" style="background:' + meta.color + '"></span> ' + meta.label + "</span>" +
            (ev.is_adhoc ? ' <span class="chip chip-gray">Ad-hoc</span>' : ' <span class="chip chip-gray">Scheduled</span>') +
            "<h3>" + esc(ev.training_program || ev.topic || "Training") + "</h3>" +
            "</div>" +
            '<button class="icon-btn" id="drawerClose" title="Close">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12" /></svg></button>';
          document.getElementById("drawerHead").innerHTML = head;
          document.getElementById("drawerClose").onclick = closeDrawer;

          var body =
            '<div class="drawer-section">' +
            '<div class="drawer-section-title">Details</div>' +
            '<div class="meta-grid">' +
            metaRow("Date", esc(evStart(ev) === evEnd(ev) ? evStart(ev) : evStart(ev) + " — " + evEnd(ev))) +
            metaRow("Time", esc(ev.time || "—")) +
            metaRow("Zone", esc(ev.zone || "—")) +
            metaRow("Region", esc(ev.region || "—")) +
            metaRow("District", esc(ev.district || "—")) +
            metaRow("Branch", esc(ev.branch || "—")) +
            metaRow("Trainer", esc(ev.trainer_name || "—")) +
            metaRow("Participants", ev.participants || 0) +
            metaRow("Venue", esc(ev.training_location || "—")) +
            "</div></div>";

          body +=
            '<div class="drawer-section">' +
            '<div class="drawer-section-title">Completion ' + score + "/5</div>" +
            '<div class="progress-row">' +
            '<div class="progress-track"><div class="progress-fill' + (pct === 100 ? " complete" : "") + '" style="width:' + pct + '%"></div></div>' +
            '<span class="progress-pct">' + pct + "%</span>" +
            "</div></div>";

          var checkList = CHECK_FIELDS.map(function (f) {
            var on = !!ev[f.key];
            var input = r.canEdit
              ? '<input type="checkbox" ' + (on ? "checked" : "") + ' data-field="' + f.key + '" />'
              : "";
            return '<label class="check-item' + (on ? " done" : "") + '">' +
              input +
              '<span class="ck-label">' + f.label + "</span>" +
              '<span class="ck-val">' + (on ? "Yes" : "No") + "</span></label>";
          }).join("");
          body += '<div class="drawer-section"><div class="drawer-section-title">Training Status</div>' + checkList + "</div>";

          if (r.showBudget) {
            var expStatus = ev.actual_expense > 0 ? "Recorded" : "Pending";
            body +=
              '<div class="drawer-section"><div class="drawer-section-title">Budget &amp; Expenses</div>' +
              '<div class="meta-grid">' +
              metaRow("Budget Amount", inr(ev.budget_amount)) +
              metaRow("Actual Expense", inr(ev.actual_expense)) +
              metaRow("Expense Status", expStatus) +
              "</div></div>";
          }

          if (r.canEdit) {
            body +=
              '<div class="drawer-section">' +
              '<div class="drawer-section-title">Trainer Remarks</div>' +
              '<textarea class="remarks-box" id="remarksInput" placeholder="Add remarks...">' + esc(ev.trainer_remarks || "") + "</textarea>" +
              "</div>";
          } else if (ev.trainer_remarks) {
            body +=
              '<div class="drawer-section">' +
              '<div class="drawer-section-title">Trainer Remarks</div>' +
              '<div class="remarks-read">' + esc(ev.trainer_remarks) + "</div></div>";
          }

          document.getElementById("drawerBody").innerHTML = body;

          var actions = "";
          if (r.canEdit) {
            actions += '<button class="btn" id="saveRemarksBtn">Save Remarks</button>';
          }
          actions += '<button class="btn btn-primary" id="drawerDone">Done</button>';
          document.getElementById("drawerActions").innerHTML = actions;
          if (r.canEdit) {
            document.getElementById("saveRemarksBtn").onclick = function () { saveRemarks(); };
            document.querySelectorAll("#drawerBody .check-item input").forEach(function (inp) {
              inp.onchange = function () { toggleStatus(ev, inp.dataset.field, inp.checked); };
            });
          }
          document.getElementById("drawerDone").onclick = closeDrawer;

          drawerOverlay.classList.add("open");
          drawer.classList.add("open");
          drawer.setAttribute("aria-hidden", "false");
        }

        function metaRow(k, v) {
          return '<div class="meta-item"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
        }

        function toggleStatus(ev, field, value) {
          var val = value ? 1 : 0;
          ev[field] = val;
          api("update_training_status", { training_name: ev.name, field: field, value: val })
            .then(function (res) {
              if (res && res.status) ev.status = res.status;
              openDrawer(ev);
              render();
              showToast("Training " + (statusOf(ev) === "completed" ? "marked complete" : "status updated"));
            })
            .catch(function (e) {
              ev[field] = val ? 0 : 1;
              openDrawer(ev);
              render();
              showToast("Update failed: " + e.message);
            });
        }

        function saveRemarks() {
          var ev = state.currentEvent;
          if (!ev) return;
          var val = (document.getElementById("remarksInput") || {}).value || "";
          api("update_training_status", { training_name: ev.name, field: "trainer_remarks", value: val })
            .then(function () { ev.trainer_remarks = val; showToast("Remarks saved"); })
            .catch(function (e) { showToast("Could not save remarks: " + e.message); });
        }

        /* ---------- Add training ---------- */
        var addModal = document.getElementById("addModal");

        function openAddModal() {
          if (!role().canAdd) return;
          document.getElementById("new-program").value = "";
          document.getElementById("new-from-date").value = todayIso();
          document.getElementById("new-to-date").value = todayIso();
          document.getElementById("new-time").value = "";
          document.getElementById("new-end-time").value = "";
          document.getElementById("new-location").value = "";
          document.getElementById("new-branch").value = "";
          document.getElementById("new-zone").value = "";
          document.getElementById("new-region").value = "";
          document.getElementById("new-district").value = "";
          document.getElementById("new-adhoc").checked = false;
          state.selectedParticipants = [];
          var pc = document.getElementById("participant-chips");
          if (pc) pc.innerHTML = "";
          var ps = document.getElementById("new-participant-search");
          if (ps) ps.value = "";
          var pcount = document.getElementById("participant-count");
          if (pcount) pcount.textContent = "(0 selected)";
          // Auto-fill trainer from session user's linked Employee
          var trainerInput = document.getElementById("new-trainer");
          if (trainerInput) {
            trainerInput.value = state.currentEmployeeName || "";
          }
          addModal.classList.add("open");
          document.getElementById("new-program").focus();
        }
        function closeModal(id) {
          document.getElementById(id).classList.remove("open");
        }
        function saveTraining() {
          // Parse flexible time input into minutes-since-midnight (returns -1 if invalid)
          function parseTime(t) {
            if (!t) return -1;
            t = t.trim();
            var m = t.match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp][Mm])?$/);
            if (!m) return -1;
            var h = parseInt(m[1], 10), mi = parseInt(m[2] || "0", 10);
            var ap = (m[3] || "").toUpperCase();
            if (ap === "PM" && h < 12) h += 12;
            if (ap === "AM" && h === 12) h = 0;
            if (h > 23 || mi > 59) return -1;
            return h * 60 + mi;
          }

          var program = document.getElementById("new-program").value.trim();
          var date = document.getElementById("new-from-date").value;
          var toDate = document.getElementById("new-to-date").value || date;
          if (!program) { showToast("Training program is required"); return; }
          if (!date) { showToast("From Date is required"); return; }
          if (toDate < date) { showToast("To Date cannot be before From Date"); return; }

          var startTime = document.getElementById("new-time").value.trim();
          var endTime = document.getElementById("new-end-time").value.trim();
          if (!startTime) { showToast("Start Time is required"); return; }
          if (!endTime) { showToast("End Time is required"); return; }
          var startMins = parseTime(startTime);
          var endMins = parseTime(endTime);
          if (startMins === -1) { showToast("Start Time format invalid — e.g. 9:00 or 9:00 AM"); return; }
          if (endMins === -1) { showToast("End Time format invalid — e.g. 11:00 or 11:00 AM"); return; }
          if (endMins <= startMins) { showToast("End Time must be after Start Time"); return; }

          var trainerSel = document.getElementById("new-trainer");
          var isAdhoc = document.getElementById("new-adhoc").checked ? 1 : 0;
          var args = {
            training_program: program,
            from_date: date,
            to_date: toDate,
            start_time: startTime,
            end_time: endTime,
            training_location: document.getElementById("new-location").value.trim(),
            trainer: trainerSel.value.trim() || null,
            zone: document.getElementById("new-zone").value,
            region: document.getElementById("new-region").value,
            district: document.getElementById("new-district").value,
            branch: document.getElementById("new-branch").value.trim() || null,
            is_adhoc: isAdhoc,
            participants: JSON.stringify(state.selectedParticipants),
            submit: 1,
          };
          api("create_training", args).then(function () {
            var p = date.split("-");
            state.selectedDate = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
            state.viewDate = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1);
            if (state.viewMode !== "month") { state.viewMode = "month"; syncViewSwitch(); }
            closeModal("addModal");
            loadData(true);
            showToast(isAdhoc ? "Ad-hoc training scheduled" : "Training scheduled");
          }).catch(function (e) {
            showToast("Could not save training: " + e.message);
          });
        }

        /* ---------- MIS report (admin, demo preview) ---------- */
        function openMisModal() {
          var d = state.viewDate || new Date(today);
          var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          var evs = filteredEvents().filter(function (e) { return evStart(e).slice(0, 7) === key; });
          var counts = statusCounts(evs);
          var rows = [
            ["Total Trainings", evs.length],
            ["Delivered", counts.completed + counts.inprogress + evs.filter(function (e) { return e.training_delivered && statusOf(e) === "upcoming"; }).length],
            ["Attendance Marked", evs.filter(function (e) { return e.attendance_marked; }).length],
            ["Pre-Assessment", evs.filter(function (e) { return e.pre_assessment_taken; }).length],
            ["Post-Assessment", evs.filter(function (e) { return e.post_assessment_taken; }).length],
            ["Feedback Taken", evs.filter(function (e) { return e.feedback_taken; }).length],
            ["Ad-hoc", evs.filter(function (e) { return e.is_adhoc; }).length],
          ];
          var html =
            '<div style="font-size:13px;color:var(--ink-3);margin-bottom:12px">' +
            "Subject: L&D Monthly Training Report &mdash; " + MONTHS[d.getMonth()] + " " + d.getFullYear() + "<br>" +
            "Recipients: mis@example.com (MIS HO) &mdash; L&D Admin validation required" +
            "</div>" +
            '<table class="mis-table">' +
            rows.map(function (r) {
              return '<tr><td style="padding:5px 8px;border-bottom:1px solid var(--border);font-size:13px">' + r[0] +
                '</td><td style="padding:5px 8px;border-bottom:1px solid var(--border);font-weight:600;text-align:right">' + r[1] + "</td></tr>";
            }).join("") +
            "</table>" +
            '<div class="form-actions">' +
            '<button class="btn" data-close="misModal">Close</button>' +
            '<button class="btn btn-primary" id="misSend">Send to MIS HO</button>' +
            "</div>";
          document.getElementById("misBody").innerHTML = html;
          document.getElementById("misModal").classList.add("open");
          document.getElementById("misSend").onclick = function () {
            closeModal("misModal");
            showToast("MIS email sending — backend integration pending");
          };
        }

        /* ---------- Toast ---------- */
        var toastTimer = null;
        function showToast(msg) {
          var t = document.getElementById("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
        }

        /* ---------- Wire up ---------- */
        document.getElementById("collapseBtn").onclick = function () {
          document.getElementById("app").classList.toggle("collapsed");
        };

        document.querySelectorAll("#viewSwitch button").forEach(function (b) {
          b.onclick = function () {
            state.viewMode = b.dataset.view;
            syncViewSwitch();
            if (state.viewMode === "month") {
              var d = state.selectedDate || new Date(today);
              state.viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
            }
            loadData();
          };
        });

        document.getElementById("prevBtn").onclick = function () {
          if (state.viewMode === "month") {
            state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() - 1, 1);
          } else if (state.viewMode === "week") {
            var s = new Date(state.selectedDate || today);
            s.setDate(s.getDate() - 7);
            state.selectedDate = s;
          } else {
            var d = new Date(state.selectedDate || today);
            d.setDate(d.getDate() - 1);
            state.selectedDate = d;
          }
          loadData();
        };
        document.getElementById("nextBtn").onclick = function () {
          if (state.viewMode === "month") {
            state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() + 1, 1);
          } else if (state.viewMode === "week") {
            var s = new Date(state.selectedDate || today);
            s.setDate(s.getDate() + 7);
            state.selectedDate = s;
          } else {
            var d = new Date(state.selectedDate || today);
            d.setDate(d.getDate() + 1);
            state.selectedDate = d;
          }
          loadData();
        };
        document.getElementById("todayBtn").onclick = function () {
          state.selectedDate = new Date(today);
          state.viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
          if (state.viewMode !== "month") { state.viewMode = "month"; syncViewSwitch(); }
          loadData();
        };

        document.querySelectorAll(".nav-item[data-status]").forEach(function (b) {
          b.onclick = function () {
            state.statusFilter = state.statusFilter === b.dataset.status ? null : b.dataset.status;
            render();
          };
        });

        document.getElementById("searchInput").oninput = function (e) {
          state.search = e.target.value;
          render();
        };

        drawerOverlay.onclick = closeDrawer;
        document.getElementById("btn-reset");
        document.getElementById("misBtn").onclick = openMisModal;
        document.querySelectorAll("[data-close]").forEach(function (b) {
          b.onclick = function () { closeModal(b.dataset.close); };
        });

        var addTrainingBtn = document.createElement("button");
        addTrainingBtn.className = "btn btn-primary";
        addTrainingBtn.id = "btn-add-training";
        addTrainingBtn.style.display = "none";
        addTrainingBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg> Add Training';
        addTrainingBtn.onclick = openAddModal;
        document.querySelector(".header-right").appendChild(addTrainingBtn);

        document.getElementById("btn-save-training").onclick = saveTraining;

        /* ---------- Branch custom dropdown (Add Training modal) ---------- */
        (function () {
          var branchInput = document.getElementById("new-branch");
          var branchDd = document.getElementById("branch-dropdown");
          var selectedBranch = "";

          function renderDropdown(filter) {
            var opts = (state.branchOptions || []).filter(function (b) {
              return !filter || b.toLowerCase().includes(filter.toLowerCase());
            });
            if (!opts.length) {
              branchDd.innerHTML = '<div style="padding:8px 12px;font-size:13px;color:var(--ink-3)">No branches found</div>';
            } else {
              branchDd.innerHTML = opts.map(function (b) {
                return '<div class="branch-opt" data-val="' + esc(b) + '" style="' +
                  'padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink-1);' +
                  (b === selectedBranch ? 'background:var(--accent-soft);color:var(--accent-ink);font-weight:600;' : '') +
                  '">' + esc(b) + '</div>';
              }).join("");
            }
            branchDd.style.display = "block";
          }

          function closeDd() { branchDd.style.display = "none"; }

          function selectBranch(val) {
            selectedBranch = val;
            branchInput.value = val;
            closeDd();
            // Auto-fill geo
            api("get_branch_geo", { branch: val })
              .then(function (geo) {
                document.getElementById("new-zone").value = geo.zone || "";
                document.getElementById("new-region").value = geo.region || "";
                document.getElementById("new-district").value = geo.district || "";
              })
              .catch(function () {});
          }

          branchInput.addEventListener("focus", function () {
            renderDropdown(this.value);
          });

          branchInput.addEventListener("input", function () {
            selectedBranch = "";
            document.getElementById("new-zone").value = "";
            document.getElementById("new-region").value = "";
            document.getElementById("new-district").value = "";
            renderDropdown(this.value);
          });

          branchDd.addEventListener("mousedown", function (e) {
            var opt = e.target.closest(".branch-opt");
            if (opt) { e.preventDefault(); selectBranch(opt.dataset.val); }
          });

          document.addEventListener("click", function (e) {
            if (!branchInput.contains(e.target) && !branchDd.contains(e.target)) closeDd();
          });
        })();

        /* ---------- Participants (Add Training modal) ---------- */
        (function () {
          var pSearch = document.getElementById("new-participant-search");
          var pDd = document.getElementById("participant-dropdown");
          var pChips = document.getElementById("participant-chips");

          function pLabel() {
            var n = state.selectedParticipants.length;
            return n === 1 ? "1 participant" : n + " participants";
          }

          function escP(v) { return esc(v); }

          function pEmployees() {
            var branch = (document.getElementById("new-branch") || {}).value || "";
            var bq = branch.toLowerCase();
            return (state.allEmployees || []).filter(function (emp) {
              if (bq && (emp.sahayog_branch || "").toLowerCase() !== bq) return false;
              if (state.selectedParticipants.indexOf(emp.name) !== -1) return false;
              return true;
            });
          }

          function renderPDd(filter) {
            var q = (filter || "").trim().toLowerCase();
            var list = pEmployees().filter(function (emp) {
              var hay = (emp.employee_name + " " + (emp.sahayog_branch || "")).toLowerCase();
              return !q || hay.indexOf(q) !== -1;
            });
            if (!list.length) {
              pDd.innerHTML = '<div style="padding:8px 12px;font-size:13px;color:var(--ink-3)">No employees found</div>';
            } else {
              pDd.innerHTML = list.map(function (emp) {
                return '<div class="branch-opt" data-val="' + esc(emp.name) + '" style="' +
                  'padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink-1);display:flex;justify-content:space-between;gap:8px' +
                  '">' +
                  '<span>' + esc(emp.employee_name || emp.name) + '</span>' +
                  (emp.sahayog_branch ? '<span style="color:var(--ink-3);font-size:11px">' + escP(emp.sahayog_branch) + '</span>' : '') +
                  '</div>';
              }).join("");
            }
            pDd.style.display = "block";
          }

          function renderPChips() {
            var byName = {};
            state.allEmployees.forEach(function (e) { byName[e.name] = e; });
            pChips.innerHTML = state.selectedParticipants.map(function (empName) {
              var emp = byName[empName] || {};
              return '<span class="participant-chip">' + esc(emp.employee_name || empName) +
                '<button type="button" data-remove="' + esc(empName) + '" title="Remove">&times;</button></span>';
            }).join("");
            document.getElementById("participant-count").textContent = "(" + pLabel() + ")";
          }

          function addParticipant(val) {
            if (state.selectedParticipants.indexOf(val) !== -1) return;
            state.selectedParticipants.push(val);
            renderPChips();
            pSearch.value = "";
            pDd.style.display = "none";
            pSearch.focus();
          }

          pSearch.addEventListener("focus", function () { renderPDd(this.value); });
          pSearch.addEventListener("input", function () { renderPDd(this.value); });
          pDd.addEventListener("mousedown", function (e) {
            var opt = e.target.closest(".branch-opt");
            if (opt) { e.preventDefault(); addParticipant(opt.dataset.val); }
          });
          document.addEventListener("click", function (e) {
            if (!pSearch.contains(e.target) && !pDd.contains(e.target)) pDd.style.display = "none";
          });
          pChips.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-remove]");
            if (btn) {
              var i = state.selectedParticipants.indexOf(btn.dataset.remove);
              if (i !== -1) state.selectedParticipants.splice(i, 1);
              renderPChips();
            }
          });
        })();

        /* ---------- Init ---------- */
        state.viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        state.selectedDate = new Date(today);
        setupFilters();
        api("get_user_role_info")
          .then(function (info) {
            if (info.is_ld_admin) state.role = "ld_admin";
            else if (info.is_ld_trainer) state.role = "trainer";
            else if (info.is_ld_viewer) state.role = "viewer";
            else state.role = "general";
            state.currentEmployee = (info.employee && info.employee.name) ? info.employee.name : null;
            state.currentEmployeeName = (info.employee && info.employee.employee_name) ? info.employee.employee_name : null;
            setupRoleUI();
            return loadGeo();
          })
          .then(function () { loadData(true); })
          .catch(function (err) { console.error("init failed", err); });
      })();
    </script>
  </body>
</html>
